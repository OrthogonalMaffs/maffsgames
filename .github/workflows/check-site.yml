name: check-site

# Does every page actually run? Two site-wide sweeps once left chart-interrogator
# and modular-battle dead for six months, because the only checker in the repo
# verified that code existed rather than that it ran. This workflow is the layer
# that would have caught them on the push that broke them.
#
# No secrets, no paid runner. scripts/check-site.py aborts every request to the
# Apps Script endpoint, to Google Analytics and to Firebase before it leaves the
# runner, so a CI run can never write into the production Events sheet or the
# live leaderboard.
#
# LAYOUT (1 Oct 2026). Until then this was one serial job: about 11.5 minutes on a
# good run, 18m 11s on a bad one, against a 20-minute limit, and every new content
# verifier added to it. The bad run was not our code: `playwright install --with-deps`
# fetched 32 MB of Ubuntu libraries from azure.archive.ubuntu.com at 83 kB/s (6m 26s).
# Now:
#   - the checks run in Microsoft's Playwright image, which has Chromium and every
#     system library it needs baked in, so no job touches an apt mirror or downloads
#     a browser. The image tag and requirements-ci.txt pin the same Playwright version;
#     bump them together.
#   - the checks are split into parallel jobs, each with its own timeout. Nothing a
#     check checks has changed; only where it runs.
# SPLIT AGAIN (7 Oct 2026, canon §7.8): tier 1 runs as four shards, the site-wide checks in a job of their
# own, tier 4 apart from the shared-asset tests; later that day content group B in four, C in four parts
# and D in two, so that no content job runs past 4 minutes (canon §7.8.1).
# VERIFIERS DECLARE THEIR OWN GROUP (contract V, 7 Oct 2026, canon §7.8.2). The "Content verifiers" groups are
# no longer listed here: each script carries "# ci-line: <group> | <label> | <args>" headers, and
# scripts/ci-groups.py builds the "content" job's matrix from them in the plan job. Adding a content verifier
# never edits this file: put its ci-line in whichever group keeps every group under 4 minutes as a job (each
# job's summary lists every check's duration). The groups' names and timeouts are GROUPS in ci-groups.py.
# Until then every new verifier edited this shared file, and two of the cloud lane's PRs conflicted here.
# scripts/check-verifier-coverage.py fails the run if any scripts/verify-*.py declares no ci-line and no
# ci-held reason, or any scripts/test-*.py is neither declared nor listed here.
#
# SELECTIVE RUNS (4 Oct 2026, canon §7.8). The repo is public, so Actions minutes are free; what a PR
# costs is wall-clock. On a pull request the "plan" job asks scripts/ci-deps.py which content verifiers
# the change can affect (a dependency map DERIVED from each verifier's source and the pages it tests,
# never a hand-kept list), and the "Content verifiers" groups run only those lines. Every other group,
# and the leaderboard-coverage job, is site-wide and always runs. A change to CI itself (.github/,
# scripts/ci-*, requirements*.txt) or to a path in no known area runs everything. The safety net: a push
# to main (every merge), the weekly schedule and a manual run all run EVERYTHING; a failure there is a red
# run on main. The "gate" job is the one check that sums up a run (for branch protection, later).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"          # Mondays 05:17 UTC: the weekly full run
  workflow_dispatch:

# A new push to a PR supersedes its running checks; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which content verifiers does this run need? All of them, except on a pull request, where
  # scripts/ci-deps.py selects from the files the PR changes. Its selftest proves the selection rules
  # on every run first (one game -> its verifier; a shared asset -> every verifier whose pages load it;
  # CI or an unknown path -> everything; every verifier reachable). It also builds the content groups from
  # the verifiers' ci-line headers (scripts/ci-groups.py; a malformed header or an unknown group fails here).
  plan:
    name: Plan (which content verifiers this change needs)
    runs-on: ubuntu-24.04          # pinned: see the coverage job
    timeout-minutes: 5
    outputs:
      run_all: ${{ steps.select.outputs.run_all }}
      selected: ${{ steps.select.outputs.selected }}
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # the PR's base commit, for the diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q "pyyaml==6.0.3"
      - name: Selection rules (self-test)
        run: python scripts/ci-deps.py --selftest
      - name: Content groups (from each verifier's ci-line headers)
        id: groups
        run: python scripts/ci-groups.py --selftest && python scripts/ci-groups.py && python scripts/ci-groups.py --github-output "$GITHUB_OUTPUT"
      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python scripts/ci-deps.py --changed-from "$BASE" --github-output "$GITHUB_OUTPUT"
          else
            python scripts/ci-deps.py --all --github-output "$GITHUB_OUTPUT"
          fi

  # One required check for the whole run: it fails unless every job that ran passed (none failed,
  # none cancelled, none skipped). Branch protection, when Jon adds it, requires only this.
  gate:
    name: Gate (every job passed)
    if: always()
    needs: [plan, coverage, check-site, content]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success")] | length')
          if [ "$bad" != "0" ]; then echo "::error::$bad job(s) did not pass"; exit 1; fi

  # docs/audits/REGISTER.md is generated from docs/audits/findings/<slug>.yml, and no PR edits it (7 Oct 2026,
  # canon §0.4): every fix PR used to regenerate it, so any two PRs conflicted. On a push to main, once the Gate
  # has passed, this job regenerates it from the newest main and commits it as the workflow's GITHUB_TOKEN if it
  # changed ("[skip ci]": a push by GITHUB_TOKEN starts no workflow anyway). If main moves between the fetch and
  # the push, it fetches and regenerates again. Never runs on a PR, the schedule or a manual run.
  register:
    name: Regenerate REGISTER.md (main only)
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: regenerate-register
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q "pyyaml==6.0.3"
      - name: Regenerate and commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/audit-register.py
            if git diff --quiet -- docs/audits/REGISTER.md; then
              echo "REGISTER.md unchanged at $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git add docs/audits/REGISTER.md
            git commit -q -m "Regenerate REGISTER.md [skip ci]"
            if git push -q origin HEAD:main; then
              echo "REGISTER.md regenerated and committed: $(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main moved during attempt $attempt; fetching again"
            sleep 5
          done
          echo "::error::could not push the regenerated REGISTER.md after 3 attempts"
          exit 1

  # Runs on the bare runner because it takes about a second and needs only node,
  # which the runner ships, so a coverage break is reported before any image is pulled.
  #
  # This guard existed and had never once executed: it is JavaScript, and the
  # machine this repo is usually worked on has no node. A guard that only runs
  # where someone happens to have the right tool is not a guard — the same
  # shape as the gap that let two games sit dead for six months. The script
  # needs no dependencies (only fs and path, CommonJS, no "type" in
  # package.json), so there is nothing to install and no setup-node step.
  coverage:
    name: Leaderboard coverage (every live game submits, or is declared)
    # Pinned, not ubuntu-latest. GitHub migrates that label to Ubuntu 26 from
    # 19 October 2026, and an image change must not be able to turn this check red
    # without anyone touching the repo — a checker nobody trusts is worse than no
    # checker. Bump this deliberately, after a green run on the new image.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Any check may call git. In the container job the checkout belongs to the runner's user, not
      # the container's root, and git refuses a repository it does not own (exit 128). Mark this
      # workspace, and only this workspace, as safe once per job, before any check runs.
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node scripts/check-leaderboard-coverage.js
      # For the record: the fallback fonts the bare runner resolves, which the container's
      # font pin below reproduces.
      - name: Fallback fonts on the bare runner
        run: fc-match sans-serif; fc-match monospace

  # The site-wide jobs: their lines are listed here. The content groups run in the "content" job (at the end),
  # which shares this job's container and steps (the YAML anchors check-container and check-steps).
  check-site:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04          # pinned: see the coverage job
    timeout-minutes: ${{ matrix.timeout }}
    container: &check-container
      # Pinned to the Playwright version in requirements-ci.txt (its browsers are built for it).
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      # --ipc=host: Chromium's shared memory, as Playwright's Docker docs advise.
      # --add-host: a job-level network guard under every script's own. The Apps Script
      # endpoint and Google Analytics' collect hosts are write-only sinks (nothing reads
      # from them), so they resolve to nowhere in every job, whatever a script does.
      # Firebase writes are kept off by the shared assets' production-hostname gate, by
      # serve-stubbed.py, by check-site.py's guard and by the database's create-only rules.
      options: >-
        --ipc=host
        --add-host=script.google.com:0.0.0.0
        --add-host=script.googleusercontent.com:0.0.0.0
        --add-host=www.google-analytics.com:0.0.0.0
        --add-host=region1.google-analytics.com:0.0.0.0
    strategy:
      fail-fast: false             # one group's failure must not hide another's
      matrix:
        include:
          # Tier 1 loads every page and level (KaTeX and fonts allowed, every write
          # aborted and counted by the network guard); tier 2 scans for hang loops.
          # Every index.html outside games/ and escape-rooms/ is discovered, not listed.
          # SHARDS (7 Oct 2026, canon §7.8): tier 1 is split four ways. Page k of check-site.py's stable page
          # order goes to shard (k mod 4) + 1, with all its level loads, level controls and phone-width checks;
          # tier 2 and the other parts that cannot be split run once, in shard 1. Each shard first runs
          # --shard-selftest 4: the four shards together are the unsharded page list, no page in two, and this
          # file runs all four. Until then tier 1 and the 15 checks below ran one after another in one job
          # (6.5 minutes, the critical path of every PR).
          - name: Tiers 1 + 2 (shard 1/4)
            timeout: 10
            checks: |
              Tier 1 (page load) shard 1/4 + Tier 2 (hang-loop scan)|python scripts/check-site.py --shard-selftest 4 && python scripts/check-site.py --workers 4 --shard 1/4
          - name: Tiers 1 + 2 (shard 2/4)
            timeout: 10
            checks: |
              Tier 1 (page load) shard 2/4|python scripts/check-site.py --shard-selftest 4 && python scripts/check-site.py --workers 4 --shard 2/4
          - name: Tiers 1 + 2 (shard 3/4)
            timeout: 10
            checks: |
              Tier 1 (page load) shard 3/4|python scripts/check-site.py --shard-selftest 4 && python scripts/check-site.py --workers 4 --shard 3/4
          - name: Tiers 1 + 2 (shard 4/4)
            timeout: 10
            checks: |
              Tier 1 (page load) shard 4/4|python scripts/check-site.py --shard-selftest 4 && python scripts/check-site.py --workers 4 --shard 4/4

          # The site-wide checks, each over the whole site, one after another (until 7 Oct 2026 they ran after
          # tier 1, in the same job).
          # The link check is stdlib-only and takes about a second.
          # The footer check (stdlib, about a second): every page carries the one canonical
          # footer and links schools/assets/site-footer.css; no page styles it privately.
          # The theme check (stdlib, about a second): canon 7.5. Each game's palette is derived
          # from the roster's Levels column; MIGRATED games must link schools/assets/theme.css,
          # carry that data-theme and use only the shared fonts and base tokens. NOT_YET games
          # are reported, never failed.
          # The publish-scope check (stdlib, about a second): canon 7.7. Every file Pages would publish
          # is under a SITE path, and no SITE page references a file _config.yml excludes.
          # The verifier-coverage check (stdlib, about a second): every scripts/verify-*.py and
          # scripts/test-*.py is run by a group below, or declared held in that script with a reason.
          # The spec-mapping check (stdlib, about a second): every game the portal links is on the spec
          # map against a reference, or in its UNMAPPED list (reported, never fails); a new unmapped game
          # or a stale UNMAPPED entry fails. The public-claims check (stdlib, about a second): no published
          # page says no data is collected (the site records anonymous gameplay statistics; the privacy
          # page is the source of truth). Both added 3 Oct 2026 after the About page claimed both.
          # The tax-year check (stdlib, about a second): canon 7.1.4. Every game with UK tax/NI wording
          # is registered, and any tax year it prints is scripts/uk_rates.py's teaching year.
          # The calculator check (stdlib, under a second): canon 4.4. A game loads the shared on-screen
          # calculator (schools/assets/calculator.js) and shows "Calculator required" exactly when its
          # roster Calculator field is "required"; no other page loads it.
          # The content-safety check (stdlib, about a second): canon SR-14's three tiers. Every game's and
          # escape room's student-facing text: tier (a) words fail anywhere, tier (b) (illness, injury) only
          # in humour fields; technical terms and Tax Theft allowlisted. The hits present on 4 Oct 2026 are
          # KNOWN (reported, never failed: todo's SR-14 fix batch); a new hit or a stale KNOWN count fails.
          # The teacher-line check (about 40s with its self-test): every roster game loads schools/assets/teacher-invite.js
          # and mounts it once with its own directory name, on its results screen after the last control row (Jon,
          # 5 Oct 2026; two games with no end keep the start screen, one is pending a rebuild); the four function-route
          # games are played to every end state, and every live escape room to a win and a loss, in Chromium at 390
          # and 1280px; on every roster page the line reads at 4.5:1 or better and is not squeezed into a flex row;
          # /leaderboards/ mounts it with no game; the link text is Jon's exact wording (4 Oct 2026).
          # The findings register (PyYAML, about a second; Jon, 6 Oct 2026): docs/audits/findings/<slug>.yml, one file per
          # audited game, each valid against the audits' schema; a fixed entry names its PR, a ruled one its ruling; every
          # roster-Unlisted game has a file. It does not read docs/audits/REGISTER.md: no PR edits that file; the
          # "register" job below regenerates and commits it on main (7 Oct 2026). Self-test: a fixed entry with no PR,
          # and a schema fault, each fail.
          # The search-titles check (stdlib, about a second): every game page's and /essentials/'s <title>, meta
          # description and og:/twitter: copies equal what data/games.json generates under Jon's rules of
          # 5 Oct 2026 (titles <= 60, descriptions <= 155, no "Year 6"); edit games.json, run apply-meta.py.
          - name: Site-wide checks
            timeout: 10
            checks: |
              Links (no /schools/ redirects; every link on /updates/ resolves)|python scripts/check-canonical-links.py
              Site footer (one canonical footer, one stylesheet)|python scripts/check-footer.py
              Theme (canon 7.5: one register, palette from the roster)|python scripts/check-theme.py
              Publish scope (canon 7.7: every published file is SITE; no page uses an excluded one)|python scripts/check-publish-scope.py
              Verifier coverage (every verify-*/test-* script runs in CI, or is declared held)|python scripts/check-verifier-coverage.py
              Spec mapping (every live game is on the spec map, or in UNMAPPED)|python scripts/check-spec-mapping.py
              Public claims (no page says no data is collected)|python scripts/check-public-claims.py
              Tax year (canon 7.1.4: every tax game registered, states only the teaching year)|python scripts/check-tax-year.py
              Essentials page (every game live, mapped, offering the level its card names; SR-11)|python scripts/check-resit-page.py
              Calculator (canon 4.4: the on-screen calculator loads exactly where the roster says required)|python scripts/check-calculator.py
              Student labels (canon 7.5.3: no game, escape-room or portal page names the student's status)|python scripts/check-student-labels.py && python scripts/check-student-labels.py --selftest
              Content safety (canon SR-14 tiers: no new banned wording, no illness or injury in humour)|python scripts/check-content-safety.py
              Teacher feedback line (on every results screen, played in Chromium; own slug; exact wording)|python scripts/check-teacher-invite.py && python scripts/check-teacher-invite.py --selftest
              Search titles (every game page and /essentials/ carries the title and description data/games.json generates)|python scripts/check-meta.py && python scripts/check-meta.py --selftest
              Findings register (every audit finding filed per game, schema valid; fixed entries name their PR)|python scripts/audit-register.py --check --selftest
              Quoted figures (no figure the quoted-statistics audit found CONTRADICTED is still on its page)|python scripts/check-quoted-figures.py && python scripts/check-quoted-figures.py --selftest

          # Checker tier 4, layer A: does every game's question bank still look like the
          # one the ledger already knows about? Extracts fresh (the live bank, post any
          # runtime patch) and lints it, then fails ONLY on a violation the ledger doesn't
          # have yet (a new defect) or a ledger entry that no longer reproduces (fixed but
          # not cleared). A tracked, still-present violation is not a failure. See
          # docs/checker-tier4-design.md.
          # The shared Next control every canon 7.6 game uses: the 3s floor, one advance
          # per wrong answer, clear() cancelling its timers, the 44px target. A browser
          # test of the helper on its own (~20s), with the real floor.
          # Section clicks: the real analytics.js on the portal, every labelled element
          # clicked, each Sheet payload read (answered locally, never sent; ~15s).
          # MaffsAnswer (schools/assets/answer.js, canon 7.1.3): every outcome of money(), decimal()
          # and exact(), and money() identical to tax-theft's old moneyResult() on every string a
          # type="number" input can pass (~3s).
          # MaffsCalc (schools/assets/calculator.js, canon 4.4): arithmetic, precedence, x², √, brackets,
          # errors, the 10 s.f. display (0.1 + 0.2 shows 0.3), key sequences, keyboard, nothing sent,
          # keys >= 44px at 320/375/390px (~10s).
          # MaffsKeypad (schools/assets/keypad.js, canon 4.4), the phone keypad for typed answers that MaffsCalc's
          # answer mode composes: 1, 2 and 4 answer boxes on touch phones at 320/375/390 (keys reach the active
          # box only, DEL and C act on it alone, nothing editable is focused, the length limit holds, the active
          # box is marked and its tag lies over no other box), ordinary inputs with a mouse; six planted faults (~40s).
          # Split in two on 7 Oct 2026 (4m38s as one job): the bank extraction and its lint stay together, since
          # the lint reads what the extraction wrote.
          - name: Tier 4 layer A (bank extraction and lint)
            timeout: 8
            checks: |
              Tier 4 layer A (bank extraction)|python scripts/extract-banks.py --workers 4
              Tier 4 layer A (lint against the ledger)|python scripts/check-banks.py --ci
              B11 value comparison (bank_common: the audits' value-equal shapes, contract F0)|python scripts/test-bank-common.py

          - name: Shared asset tests (Next control, section clicks, answer, calculator, keypad)
            timeout: 8
            checks: |
              Shared Next control (schools/assets/next-control.js)|python scripts/test-next-control.py
              Portal section clicks (analytics.js section_clicked)|python scripts/test-section-clicks.py
              Shared answer checker (schools/assets/answer.js, every outcome)|python scripts/test-answer-js.py
              Shared on-screen calculator (schools/assets/calculator.js, MaffsCalc)|python scripts/test-calculator-js.py
              Shared phone keypad (schools/assets/keypad.js, MaffsKeypad)|python scripts/check-keypad.py

    steps: &check-steps
      - uses: actions/checkout@v4
      # Any check may call git. In the container job the checkout belongs to the runner's user, not
      # the container's root, and git refuses a repository it does not own (exit 128). Mark this
      # workspace, and only this workspace, as safe once per job, before any check runs.
      # It also starts the group's clock for the time budget (below): the first step after the
      # container starts, so container start-up (about 30s) sits inside the budget's 25% headroom.
      - name: Mark the workspace as a safe git directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      # Which of this group's lines run. Site-wide groups run every line; a "Content verifiers" group
      # runs the lines whose script the plan selected (all of them on main, the schedule, a manual run,
      # or a PR that changes CI). A group with nothing selected skips its setup too.
      - name: Lines to run
        id: lines
        shell: bash
        env:
          CHECKS: ${{ matrix.checks }}
          GROUP: ${{ matrix.name }}
          RUN_ALL: ${{ needs.plan.outputs.run_all }}
          SELECTED: ${{ needs.plan.outputs.selected }}
        run: |
          run=""; n=0; skipped=0
          while IFS='|' read -r label cmd; do
            [ -z "$label" ] && continue
            script=$(grep -oE 'scripts/[A-Za-z0-9_.-]+\.py' <<< "$cmd" | head -1)
            if [[ "$GROUP" != "Content verifiers"* ]] || [ "$RUN_ALL" = "true" ] || grep -qF "\"$script\"" <<< "$SELECTED"; then
              run+="$label|$cmd"$'\n'; n=$((n + 1))
            else
              echo "skipped  $label  (not selected: nothing it depends on changed)"; skipped=$((skipped + 1))
            fi
          done <<< "$CHECKS"
          echo "$n line(s) to run, $skipped skipped"
          { echo "checks<<CHECKS_EOF"; printf '%s' "$run"; echo "CHECKS_EOF"; echo "any=$([ $n -gt 0 ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"

      # HOLDING STEP (Jon, 1 Oct 2026). The checks block web fonts, so they measure layout in the
      # machine's fallback font. The Playwright image installs more fonts than the bare runner,
      # and its fallback face set Free Daily Pizza's tightest 320x568 screens 3px taller (Next at
      # 528px against a 528px fold; 525px on the runner). Pinning the generic families to the bare
      # runner's DejaVu faces keeps every verdict what it was. KNOWN GAP: the phone-fit check
      # measures in a font no student sees, with 0-3px margin on those screens; the real fix is a
      # separate contract (self-host Outfit and KaTeX, measure in Outfit with a minimum margin).
      # The image has no DejaVu (its fallback is WenQuanYi Zen Hei), so the two Ubuntu 24.04
      # packages the runner has, 2.37-8, are fetched as files and unpacked: no apt-get update,
      # no apt mirror on the critical path, about 1.3 MB, checksum-pinned. Their fonts are
      # byte-identical to the runner's.
      - name: Pin fallback fonts to the bare runner's (DejaVu)
        if: steps.lines.outputs.any == 'true'
        run: |
          echo "before: $(fc-match sans-serif) | $(fc-match monospace)"
          fetch() {  # fetch <deb> <sha256>: Launchpad first, the Ubuntu archive as fallback
            for base in https://launchpad.net/ubuntu/+archive/primary/+files \
                        http://archive.ubuntu.com/ubuntu/pool/main/f/fonts-dejavu; do
              if curl -fsSL --retry 2 --max-time 60 -o "/tmp/$1" "$base/$1" \
                 && echo "$2  /tmp/$1" | sha256sum -c --quiet; then
                dpkg-deb -x "/tmp/$1" / && return 0
              fi
            done
            echo "::error::could not fetch $1"; return 1
          }
          fetch fonts-dejavu-core_2.37-8_all.deb 40049660c194f3b8a2541fc7369efebb10e9f94bdac836a2f38fafedd10fa73a
          fetch fonts-dejavu-mono_2.37-8_all.deb 8a599d6553307db7ecb795d2f0e5a301e03234afc75c7358b0ba43466454c89a
          cat > /etc/fonts/local.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
            <alias binding="strong"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f > /dev/null
          echo "after:  $(fc-match sans-serif) | $(fc-match monospace)"
          fc-match sans-serif | grep -q '^DejaVuSans\.ttf' && fc-match monospace | grep -q '^DejaVuSansMono\.ttf' \
            || { echo "::error::DejaVu fallback fonts not available in the image"; exit 1; }

      - name: Python packages (pinned, requirements-ci.txt)
        if: steps.lines.outputs.any == 'true'
        run: |
          python --version
          echo "CPUs: $(nproc)"
          python -m pip install --disable-pip-version-check -q -r requirements-ci.txt
          # node for verify-test-the-claim.py: the Playwright package ships its own.
          dirname "$(python -c 'import playwright, os; print(os.path.join(os.path.dirname(playwright.__file__), "driver", "node"))')" >> "$GITHUB_PATH"

      # Each line of the group is "label|command". Every check runs, even after one
      # fails, so a single run reports every failure; the job fails if any did.
      # TIME BUDGET (Jon, 5 Oct 2026): a group fails once it passes 75% of its timeout, measured from
      # the job's first step (JOB_T0), so it is split before it is ever cut off. Group B ran past its
      # 12 minutes on every full run from #68 to #71 and was cancelled mid-verifier: a cancelled job
      # reports nothing about the checks it never reached. The budget's error is raised the moment it
      # is passed (an annotation survives a later cancel); the remaining checks still run. Every
      # check's duration goes to the log and to the job summary.
      - name: ${{ matrix.name }}
        if: steps.lines.outputs.any == 'true'
        shell: bash
        env:
          CHECKS: ${{ steps.lines.outputs.checks }}
          GROUP: ${{ matrix.name }}
          TIMEOUT_MIN: ${{ matrix.timeout }}
        run: |
          node --version
          mmss() { printf '%dm%02ds' $(($1 / 60)) $(($1 % 60)); }
          budget=$((TIMEOUT_MIN * 60 * 3 / 4)); over=""
          { echo "### $GROUP"; echo; echo "Time budget: $(mmss $budget) (75% of ${TIMEOUT_MIN}m)"; echo
            echo "| Check | Result | Duration | Group elapsed |"; echo "|---|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          failed=()
          while IFS='|' read -r label cmd; do
            [ -z "$label" ] && continue
            echo "::group::$label"
            start=$SECONDS
            if bash -c "$cmd"; then status=ok; else status=FAILED; failed+=("$label"); fi
            echo "::endgroup::"
            took=$((SECONDS - start)); elapsed=$(( $(date +%s) - JOB_T0 ))
            echo "$status  $label  (${took}s; group at $(mmss $elapsed) of ${TIMEOUT_MIN}m)"
            echo "| $label | $status | ${took}s | $(mmss $elapsed) |" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$over" ] && [ $elapsed -gt $budget ]; then
              over="$GROUP at $(mmss $elapsed) of ${TIMEOUT_MIN}m (budget $(mmss $budget), 75%): split it"
              echo "::error::time budget: $over"
            fi
          done <<< "$CHECKS"
          elapsed=$(( $(date +%s) - JOB_T0 ))
          echo; echo "group total: $(mmss $elapsed) of ${TIMEOUT_MIN}m (budget $(mmss $budget))"
          { echo; echo "Group total: $(mmss $elapsed) of ${TIMEOUT_MIN}m"; } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::FAILED: %s\n' "${failed[@]}"
          fi
          if [ -n "$over" ]; then
            echo "::error::time budget: $over (move its slowest verifier into a group of its own, as A, C and D are)"
            echo "**Over the time budget:** $over" >> "$GITHUB_STEP_SUMMARY"
          fi
          [ ${#failed[@]} -eq 0 ] && [ -z "$over" ]

  # The "Content verifiers" groups (contract V, 7 Oct 2026). The matrix is built by the plan job from each
  # verifier's own "# ci-line:" headers (scripts/ci-groups.py; group names and timeouts in its GROUPS), so a new
  # verifier never edits this file. Same container, same steps, same job names as when the groups were listed
  # in check-site's matrix: "Lines to run" still runs only the lines the plan selected on a PR, everything on
  # main, the schedule and a manual run. The Gate needs this job, so a group that fails, is cancelled or is
  # skipped (a plan failure) fails the run.
  content:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04          # pinned: see the coverage job
    timeout-minutes: ${{ matrix.timeout }}
    container: *check-container
    strategy:
      fail-fast: false             # one group's failure must not hide another's
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps: *check-steps
