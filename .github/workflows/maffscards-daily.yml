# Jon's result on MaffsCards' "Today's deal" (contract DAILY-DEAL, 25 Nov 2026).
#
# Started by hand only (workflow_dispatch): by the script bound to Jon's "MaffsGames Creator" sheet when he fills a row
# (docs/apps-script-creator.md), or from this page's own Run workflow form, the same four fields, as the fallback.
# scripts/set-maffscards-daily.py validates them (the date is today or yesterday in the UK, the result is won or lost,
# the rounds are in range; a line that is too long, holds "<" or ">" or contact details is dropped, not refused) and
# writes games/maffscards/daily.json, which is committed to main as the workflow's GITHUB_TOKEN with the skip-ci words,
# exactly as answer-counts.yml commits its figures (a push by GITHUB_TOKEN starts no workflow anyway). If main moves
# between the checkout and the push the job fetches main and tries again.
#
# A refused input writes nothing and fails the run: the file on main stays as it was, and the page goes on saying
# that Jon has not played. The page shows a result only on the file's own UK date, so an old file needs no clearing.
#
# The four fields reach the script through the environment, never pasted into the shell line, so nothing typed into
# a field can run as a command.
name: maffscards-daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: "The day of the deal, YYYY-MM-DD (today or yesterday in the UK)"
        required: true
        type: string
      result:
        description: "won or lost"
        required: true
        type: string
      rounds:
        description: "How many rounds the game took (10 to 100 for a win, 10 to 200 for a loss)"
        required: true
        type: string
      line:
        description: "A line to show (optional, at most 240 characters; {N} becomes the rounds)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: maffscards-daily
  cancel-in-progress: false

jobs:
  daily:
    name: Validate and commit the daily result
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validator self-test
        run: python scripts/set-maffscards-daily.py --selftest
      - name: Validate, write, commit
        env:
          DAILY_DATE: ${{ inputs.date }}
          DAILY_RESULT: ${{ inputs.result }}
          DAILY_ROUNDS: ${{ inputs.rounds }}
          DAILY_LINE: ${{ inputs.line }}
        run: |
          set -eo pipefail          # a refused input must fail the job, not just the pipe into tee
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/set-maffscards-daily.py --date="$DAILY_DATE" --result="$DAILY_RESULT" --rounds="$DAILY_ROUNDS" --line="$DAILY_LINE" | tee -a "$GITHUB_STEP_SUMMARY"
            git add games/maffscards/daily.json
            if git diff --cached --quiet; then
              echo "daily.json unchanged at $(git rev-parse --short HEAD): this result is already on main" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -q -m "Record the MaffsCards daily result [skip ci]"
            if git push -q origin HEAD:main; then
              echo "committed $(git rev-parse --short HEAD): games/maffscards/daily.json" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main moved during attempt $attempt; fetching again"
            sleep 5
          done
          echo "::error::could not push games/maffscards/daily.json after 3 attempts"
          exit 1
