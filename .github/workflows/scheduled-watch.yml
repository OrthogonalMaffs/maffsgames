# The daily look at the answer counts (contract ANSWER-COUNTS-STALE, 26 Oct 2026; canon 7.5.5).
#
# The answer-counts job failed on every scheduled run from 25 Oct 2026 (its validator rejected the "Z" the Apps Script writes
# while London is on GMT). GitHub e-mailed Jon for each failed run, but the e-mails were buried among the rest. A run that GitHub
# never starts sends nothing at all, so once a day this workflow checks the committed schools/assets/answer-counts.json and
# FAILS, with a plain reason ("... is 26.0 hours old"), when its as_of is more than 24 hours old. Its own failure is the alert:
# GitHub e-mails a failed run of this workflow, answer-counts or check-site on main, and Jon filters those e-mails (Jon, 26 Oct
# 2026: GitHub Issues stays off; no issue is opened).
name: scheduled-watch

on:
  schedule:
    - cron: "50 7 * * *"          # 07:50 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scheduled-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Is the committed answer count under 24 hours old
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Answer counts file age
        run: python scripts/fetch-answer-counts.py --check --fresh
