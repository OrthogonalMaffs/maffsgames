  summary: 'Question: "Tom wants to borrow £2,000 for 2 years." The bank loan is £2,000 at 8% APR over 2 years;
    the credit union is £95/month for 24 months. Options: "The bank loan is cheaper — 8% APR sounds low" / "The
    credit union is cheaper — total repayment £2,280 vs approximately £2,332 for the bank loan" / "They cost the
    same — both around £2,300" / "The bank loan is better because it has a fixed rate". Keyed answer: the credit
    union is cheaper (£2,280 vs about £2,332). Correct answer: the bank loan is cheaper, at about £2,165 in total.'
  evidence: 'docs/audit-resit-correctness-2026-10-04.md F1. Evidence: £2,332 is 2000 × 1.08² = £2,332.80, which
    is the debt with **no repayments at all for 2 years** (and £2,332.80 rounds to £2,333 anyway). A 2-year loan
    at 8% APR repaid monthly costs £90.20/month, £2,164.80 in total (`recompute.py`). The credit union''s £95 ×
    24 on £2,000 works out at an APR of about 13.7%. Under the usual monthly-repayment reading the key is reversed.
    The scenario never states how the bank loan is repaid, so the question is at best unanswerable as worded. The
    explanation teaches the wrong model. Share affected: 1 of 50 core questions.'
  status: fixed
  pr: 113
