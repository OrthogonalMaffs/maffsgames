  evidence: 'docs/audit-resit-correctness-2026-10-04.md F1. Evidence: the key uses π = 3.14, which neither the question
    nor the hint states. A student using π (calculator) gets Eagle (2 strokes) not Hole in One, and is told "Actual
    answer: 565.2 cm³", which is wrong. Share affected: 1 of 9 level4 items (every level4 round).'
  status: fixed
  pr: 118
- id: estimation-golf-r-002
  severity: HIGH
  jc: false
  class: 3
  level: alevel
  where: alevel, index.html:663
  summary: 'Question: "Estimate the gradient of y = x³ at x = 3 using first principles with h = 0.001." Keyed answer:
    27 Correct answer: 27.009001 (the estimate asked for)'
  evidence: 'docs/audit-resit-correctness-2026-10-04.md F2. Evidence: ((3.001)³ − 27) / 0.001 = 27.009001. 27 is
    the exact derivative (the limit), not the h = 0.001 estimate; the student who does what is asked gets Eagle
    and is shown "Actual answer: 27". (A central difference would give 27.000001, but "first principles with h"
    normally means the forward difference.) Judgement on the method wording; the key is the limit either way. Share
    affected: 1 of 9 alevel items (every alevel round).'
  status: fixed
  pr: 118
