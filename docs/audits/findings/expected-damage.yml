    ed_gcse_018: Track A "¾ chance of 5, ¼ chance of 1"; Track B "⅓ chance of 12, ⅔ chance of 0". E(A) = 3.75 +
    0.25 = 4; E(B) = 4 + 0 = 4. Keyed: A only (`evDifference: 0.0`). Correct: either. A student who calculates correctly
    and picks B is counted as a non-optimal choice (lower Optimal Choices %, fewer stars, `correct:false` in analytics).'
  evidence: 'docs/audit-resit-correctness-2026-10-04.md F1. Share affected: 2 of 20 GCSE questions (10%, which meets
    the audit''s share threshold for CRITICAL; graded HIGH because the miscount shows only in the end-of-session
