- id: expected-damage-r-002
  severity: MEDIUM
  jc: false
  class: 6
  level: all
  where: '**OPEN, logged** (not in contract 3) all levels, index.html:789 (and the "optimal" replay at index.html:812):
    the outcome draw does not follow the probabilities shown on screen whenever a track''s probabilities total less
    than 1.'
  summary: 'Code: escape if `roll > pSum`; otherwise `adjustedRoll = roll * Math.min(pSum, 1)` and the first outcome
    whose running total reaches `adjustedRoll` is hit. Given no escape, `roll` is already uniform on [0, pSum],
    so multiplying by pSum again squeezes it into [0, pSum²] and over-weights the first listed outcome. (Using `roll`
    itself would give exactly the stated probabilities.) Example ed_ks3_014 (index.html:499), Track B shown "50%
    chance of 8, 30% chance of 2": the game actually hits 8 with probability 5/8 and 2 with 7/40 (escape 1/5 is
    right). Its E(B) as played is 5.35, not the stated 4.6, so the keyed track A (E = 5) yields fewer Muppets on
    average than B. Same flip on ed_gcse_016 (index.html:519): B played 5.44 vs keyed A 5. Monte Carlo of the copied
    code: ks3_014 B mean 5.349, gcse_016 B mean 5.443.'
  evidence: 'docs/audit-resit-correctness-2026-10-04.md F2. Share affected: 20 of 50 questions play outcomes at
    probabilities other than those displayed (ks3 3/15, gcse 9/20, core 8/15); on 2 of them (ks3_014, gcse_016)
    the track keyed as higher-EV is the lower-scoring one in play. Marking (`higherEVOption`) is unaffected, but
    the leaderboard score, the "Optimal play would have hit N" figure and the closing claim "The students who scored
    closest to optimal were not luckier. They calculated." rest on this draw.'
  status: open
