  summary: 'Three stems divide by an unbracketed coefficient-and-variable term: 6x^7 ÷ 2x^2 (keyed 3x^5), 12x^9 ÷ 4x^3 (keyed 3x^6),
    20a^4 ÷ 5a (keyed 4a^3). The keys follow the algebra convention that a division by a term divides by all of it, as the
    tranche 1 audit and the explanations ("6÷2=3, 7-2=5") do. Read strictly left to right, as the stem is printed, they are
    (6x^7 ÷ 2) × x^2 = 3x^9, 3x^12 and 4a^5, each of which is one of the item''s own distractors. SR-17 asks for conventions stated
    in the question and removes notation puzzles; the stems state neither. A ruling for Jon: bracket or fraction-bar the three
    stems (same maths, same bank size) or remove them. Under the strict reading three items mark a wrong answer right, which is SR-20''s
    count of 3 for CRITICAL, so the call is not the cloud lane''s'
  evidence: 'scripts/verify-index-laws.py (VERIFIERS-20, #296) read each stem both ways and listed these three as an expected failure'
  status: ruled
  ruling: 'Jon, 12 Oct 2026: the convention stands. In algebra a term such as 2x^2 is one object (implied multiplication binds
    tighter than ÷), so 6x^7 ÷ 2x^2 means division by the whole term; the keys are right and the stems stay as they are.
    verify-index-laws.py now reads a coefficient-and-variable term after ÷ as one term and fails only a stem that still reads
