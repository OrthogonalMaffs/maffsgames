- id: proof-builder-s1-002
  severity: MEDIUM
  jc: true
  class: NEW:exact-order sorter marking
  level: further
  where: games/proof-builder/index.html:308-309 (SORTER.further[2])
  summary: 'The 3^n > 2n + 1 sorter is marked in one exact order. Line 3 (6k + 3 = 2(k+1) + 1 + 4k) is an algebraic
    identity that needs nothing before it but the setting, so it (and the lemma 4k > 0 that follows) may be valid
    before line 2 (3^{k+1} > 6k + 3). Whether that order is an acceptable proof is a judgement: not fixed, for Jon.
    If accepted, it is an `after` map and a VALID_ORDERS entry.'
  evidence: 'Prove that 3^n > 2n+1 for all n >= 2 | lines: Base case: n=2. LHS = 9. RHS = 5. 9 > 5. True. / Assume
    3^k > 2k + 1 for some k >= 2 / 3^{k+1} = 3 x 3^k > 3(2k+1) = 6k+3 / 6k + 3 = (2k+3) + 4k = 2(k+1)+1 + 4k / Since
    k >= 2, we have 4k > 0, so 6k+3 > 2(k+1)+1 / Therefore 3^{k+1} > 2(k+1)+1, completing the inductive step / By
    mathematical induction, 3^n > 2n+1 for all n >= 2 | keyed order 0-6 only (SWEEP-1, batch 11)'
  status: open
