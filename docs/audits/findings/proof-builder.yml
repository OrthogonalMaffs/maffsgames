    triangle with hypotenuse 1 / Let the adjacent side be cos theta and the opposite side be sin theta / By Pythagoras:
    (adjacent)^2 + (opposite)^2 = (hypotenuse)^2 / So cos^2 theta + sin^2 theta = 1^2 = 1 | keyed order 0,1,2,3 only
