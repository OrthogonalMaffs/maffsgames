- id: shape-shifter-r-001
  severity: CRITICAL
  jc: false
  class: 3
  level: all
  where: 'Rotation mode (and the rotation third of Random Mix): every rotation key is the wrong direction. index.html:290-296
    (`rotatePoint`), 361 (labels), 337-349 (bases).'
  summary: '`rotatePoint` applies [cos -sin; sin cos], which on this y-up grid is an ANTICLOCKWISE turn for a positive
    angle; the question text labels angle 90 as "90° clockwise" and -90 as "90° anticlockwise" (index.html:361).
    So the keyed shape is always the image for the opposite direction, and the true image is the "wrong direction"
    distractor (`generateWrongRotations`, index.html:311). Example (first base, index.html:337): "Rotate 90° clockwise
    about (0,0)", object (1,1),(3,1),(2,3). Keyed: (-1,1),(-1,3),(-3,2) (that is 90° anticlockwise). Correct: (1,-1),(1,-3),(3,-2).
    Check: 90° clockwise about the origin sends (1,1) to (1,-1); `rotatePoint(1,1,0,0,90)` returns (-1,1). Share:
    15 of 15 rotation items (8 "clockwise", 7 "anticlockwise"; the 15-item cap is reached before any 180° item is
    built, so no 180° question exists). In play, every tap on the true image was marked "Not quite — correct answer
    was X" and the opposite-direction image marked "Correct!". 100% of Rotation mode; about a third of Random Mix
    (3 or 4 of 10).'
  evidence: 'docs/audit-resit-correctness-2026-10-04.md F1. '
  status: fixed
  pr: 36
- id: shape-shifter-r-002
  severity: CRITICAL
  jc: false
  class: NEW:tap-selects-wrong-option
  level: all
  where: 'Rotation mode: a tap on a shape often selects a different shape. index.html:740-745, 779-798.'
  summary: A tap snaps to the nearest lattice point and selects the first option (A, then B...) whose polygon contains
    it OR has any vertex within 1 grid unit of it. The four options and the object overlap (18-39 lattice points
    per question hit two or more options), so earlier-lettered options capture taps meant for later ones.
  evidence: 'docs/audit-resit-correctness-2026-10-04.md F2. Evidence: simulated tap on each option''s own label
    (its centroid, snapped as the game snaps), over all 15 items x 4 options x 24 orders: 730 of 1440 (50.7%) select
    a differently shaped option. In the browser, 21 of 40 taps on a label selected another option, e.g. tapping
    label C gave "Not quite — correct answer was C" (the student pressed the right letter and was marked wrong).
    Independent of F1: this would remain after the direction is fixed.'
  status: fixed
  pr: 36
- id: shape-shifter-r-003
  severity: HIGH
  jc: false
  class: 2
  level: all
  where: 'Rotation, duplicate options: index.html:313 (reflection distractor), 338, 343'
  summary: '"Rotate 90° clockwise/anticlockwise about (0,0)" for the squares (1,1),(3,1),(3,3),(1,3) and (0,0),(2,0),(2,2),(0,2):
    the "reflection instead" distractor (reflect in the x-axis) is the same square as the 90° clockwise image. Clockwise
    items (rot #2, #11): two of the four options are the identical shape (both the true answer, both marked wrong).
    Anticlockwise items (rot #3, #12): the keyed option and the reflection distractor are the identical shape drawn
    on top of each other; which one a tap selects depends on letter order, so in 12 of 24 orders the keyed option
    cannot be selected at all. `shapesEqual` (index.html:321-327) compares vertex lists in order, so it never sees
    these as equal. Share: 4 of 15 rotation items.'
  evidence: 'docs/audit-resit-correctness-2026-10-04.md F3. '
  status: fixed
  pr: 36
