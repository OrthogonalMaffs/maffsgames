  "notes": "<p class='lede'>The chute is the lock worth the plenary. Every number in it is correct in the students' heads and still wrong on the dial, because the letter talks about what stays and the instrument wants what goes. Groups who set it to the fraction itself have not made an arithmetic error at all &mdash; they have answered a question nobody asked &mdash; and the room says so by name rather than marking them wrong.</p><p class='lede'>The slider is the quickest of the three and the natural one to hand to whoever is standing nearest the screen. The price tags take the longest: the pair is checked together, so a group that solves it correctly and types the numbers on the wrong two tags gets told exactly that, which is a common enough error in an exam to be worth naming out loud.</p><p class='lede'>One other wrong value on the slider is worth listening for, because the room does not name it: averaging the four items that are already logged and entering that. It is real work on the wrong four numbers &mdash; the mean of the entries rather than the entry that fixes the mean &mdash; and the only sign of it is a group that is confident and slightly out.</p><p class='lede'>No calculator is needed anywhere in this room.</p>"
