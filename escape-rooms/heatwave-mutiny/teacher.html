  "notes": "<p class='lede'>The disruptor is the one to watch. A group that finds the manual but not the memo will solve the inequality perfectly, arrive at several candidate frequencies &mdash; three, four or five, depending on the numbers drawn &mdash; take the largest and lose 45 seconds. That is the designed trap and it is worth letting them hit it once: the response names exactly what happened.</p><p class='lede'>The timer and the keypad are independent and can be done in either order. If a class is running short, the keypad is the quickest of the three.</p><p class='lede'>The charging post in The Headteacher&rsquo;s Car Trap is the same lock in a different disguise: an equation with two solutions and a constraint from the story throwing one of them out. If a class has played both, ask them what the prime condition and the alarm limit have in common.</p>"
