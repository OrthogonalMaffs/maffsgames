  "notes": "<p class='lede'>This room is about using AI as a tool, not as a replacement for thinking. Mr Narry asked for a vote that looked amazing and got exactly that; nobody asked who should see the votes. Worth asking a class: what should his prompt have said, and what should he have checked himself?</p><p class='lede'>The recovery tool needs a calculator: the multiplier has to be raised to power after power until it drops below the threshold. Repeated multiplication works on a basic calculator. The mistake it is built around is taking the same share of the original every minute, which runs out sooner.</p><p class='lede'>The audit never looks at a single ballot: it works from totals only. A group that finds the overlap but divides by every voter, not by those who saw the page, gets the misconception response.</p><p class='lede'>At time-out the end screen shows every lock&rsquo;s solution. For a second attempt, press Play again for fresh numbers.</p>"
