  qStart=Date.now();updateTimer();
  const m=currentQ.m;
  rk(document.getElementById('matDisplay'),'A = \\begin{pmatrix} '+m[0][0]+' & '+m[0][1]+' \\\\ '+m[1][0]+' & '+m[1][1]+' \\end{pmatrix}');
  document.getElementById('prompt').textContent='Find the eigenvector for λ = '+currentQ.lam;
  document.getElementById('subInfo').textContent='Select the simplest integer eigenvector';
  const opts=shuffle([currentQ.c,...currentQ.d]);
  const oEl=document.getElementById('options');oEl.innerHTML='';
  opts.forEach(v=>{const b=document.createElement('button');b.className='opt-btn';b.dataset.val=v;b.innerHTML=rkI(v);b.addEventListener('click',()=>handleAnswer(b));oEl.appendChild(b)});
}
function updateTimer(){const el=document.getElementById('timer');const tick=()=>{if(document.getElementById('game').classList.contains('active')){el.textContent=Math.floor((Date.now()-qStart)/1000);requestAnimationFrame(tick)}};requestAnimationFrame(tick)}
function handleAnswer(btn){const q=currentQ,s=(Date.now()-qStart)/1000,ok=btn.dataset.val===q.c;document.querySelectorAll('.opt-btn').forEach(b=>{b.classList.add('disabled');if(b.dataset.val===q.c)b.classList.add('correct')});mfg('question_answered',{game_slug:'eigenvector-engine',level:'further',correct:ok,question_index:total});if(ok){btn.classList.add('correct');const m=1/(1+T_K*Math.log(1+s));score+=Math.max(1,Math.round(BASE*m));correctN++;updateHUD();setTimeout(nextQ,1000)}else{btn.classList.add('wrong');updateHUD();showExplain(q)}}
function showExplain(q){const sol=document.getElementById('solution');let html='<h3>Worked solution</h3>';(q.s||[]).forEach(st=>{html+='<div class="step">'+rkI(st)+'</div>'});if(q.mc)html+='<div class="misconception">⚠ '+q.mc+'</div>';html+='<button class="next-btn" onclick="closeSol()">Got it — next</button>';sol.innerHTML=html;sol.className='solution show'}
function closeSol(){document.getElementById('solution').className='solution';nextQ()}
function updateHUD(){document.getElementById('score').textContent=score;document.getElementById('correctCount').textContent=correctN}
function endGame(){const pct=total>0?Math.round(correctN/total*100):0;let t='Keep Practising!';if(pct>=90)t='Outstanding!';else if(pct>=70)t='Well Done!';else if(pct>=50)t='Good Effort!';document.getElementById('resultTitle').textContent=t;document.getElementById('finalScore').textContent=score;document.getElementById('statsLine').innerHTML='Eigenvector Engine<br>Igands Gonna Get You — Part 3<br>'+correctN+'/'+total+' correct ('+pct+'%)';window._ggAbandoned=false;mfg('game_completed',{game_slug:'eigenvector-engine',level:'further',score:score,questions_answered:total,accuracy:pct});
  if(window.MaffsLeaderboard){MaffsLeaderboard.submitScore('eigenvector-engine','further',score,total).catch(function(){});if(window.MaffsScoreHistory){MaffsScoreHistory.record('eigenvector-engine','further',score);}}var _pbKey='eve_best';var _pbOld=parseInt(localStorage.getItem(_pbKey)||'0');if(score>_pbOld){mfg('personal_best_set',{game_slug:'eigenvector-engine',level:'further',score:score,previous_best:_pbOld});localStorage.setItem(_pbKey,score)}show('results')}
(function(){var KEY='mfg_accessible',btn=document.getElementById('a11yToggle');if(!btn)return;function apply(on){document.body.classList.toggle('accessible',on);btn.classList.toggle('active',on);btn.setAttribute('aria-pressed',String(on));}apply(localStorage.getItem(KEY)==='true');btn.addEventListener('click',function(){var on=!document.body.classList.contains('accessible');localStorage.setItem(KEY,String(on));apply(on);});})();
</script>
