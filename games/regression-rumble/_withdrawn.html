:root{
--bg:#0b0e14;--surface:#141820;--surface-alt:#1c2028;--border:#2a2e3a;
--text:#e2e4e9;--muted:#7a7f90;--accent:#0ea5e9;
--green:#22c55e;--green-dim:rgba(34,197,94,.12);
--red:#ef4444;--red-dim:rgba(239,68,68,.12);
--core:#0ea5e9;--alevel:#f97316;--l4:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{padding-bottom:44px;background:var(--bg);font-family:'Outfit',system-ui,sans-serif;color:var(--text);font-size:15px;line-height:1.6;min-height:100vh;}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-title{font-size:20px;font-weight:700;}
.header-title span{color:var(--accent);}
.level-pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:12px;color:#fff;}
.back-link{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;}
.back-link:hover{color:var(--text);}
.header-stats{display:flex;align-items:center;gap:16px;}
.stat-item{text-align:center;}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--accent);}
.stat-val.timer{color:var(--muted);}

/* SELECTOR */
.selector{max-width:580px;margin:60px auto;padding:0 24px;text-align:center;}
.selector h2{font-size:26px;font-weight:700;margin-bottom:6px;}
.selector p{color:var(--muted);margin-bottom:32px;}
.sel-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;text-align:left;}
.sel-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:28px;}
.sel-btn{font-family:'Outfit',system-ui,sans-serif;font-size:14px;font-weight:600;padding:16px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s;text-align:left;}
.sel-btn:hover{border-color:var(--accent);background:rgba(14,165,233,.08);}
.sel-btn.active{border-color:var(--accent);background:rgba(14,165,233,.12);color:var(--accent);}
.sel-btn .sel-sub{font-size:12px;font-weight:400;color:var(--muted);margin-top:2px;display:block;}
.sel-btn.level-btn.core.active{border-color:var(--core);background:rgba(14,165,233,.12);color:var(--core);}
.sel-btn.level-btn.alevel.active{border-color:var(--alevel);background:rgba(249,115,22,.12);color:var(--alevel);}
.sel-btn.level-btn.l4.active{border-color:var(--l4);background:rgba(239,68,68,.12);color:var(--l4);}
.start-btn{font-family:'Outfit',system-ui,sans-serif;font-size:16px;font-weight:600;padding:14px 40px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;transition:opacity .15s;}
.start-btn:hover{opacity:.9;}
.start-btn:disabled{opacity:.4;cursor:default;}

/* GAME LAYOUT */
.game-container{display:none;max-width:1100px;margin:0 auto;padding:24px;}
.game-layout{display:grid;grid-template-columns:3fr 2fr;gap:24px;align-items:start;}
.diagram-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.diagram-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface-alt);}
.diagram-title{font-size:14px;font-weight:600;}
.diagram-context{font-size:12px;color:var(--muted);}
.diagram-body{padding-bottom:44px;padding:20px;display:flex;align-items:center;justify-content:center;}
.diagram-body canvas{max-width:100%;height:auto;}

/* RIGHT PANEL */
.question-panel{display:flex;flex-direction:column;gap:16px;}

.q-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;}
.q-number{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.q-text{font-size:14px;margin-bottom:14px;line-height:1.7;}
.q-text .katex{font-size:15px;}
.q-input-row{display:flex;gap:8px;align-items:center;}
.q-input{flex:1;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;}
.q-input:focus{border-color:var(--accent);}
.q-submit{font-family:'Outfit',system-ui,sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;}
.q-submit:hover{opacity:.9;}

.q-mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.mc-btn{font-family:'Outfit',system-ui,sans-serif;font-size:13px;font-weight:500;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface-alt);color:var(--text);cursor:pointer;text-align:left;transition:all .15s;line-height:1.5;}
.mc-btn:hover{border-color:var(--accent);}
.mc-btn.correct{border-color:var(--green);background:var(--green-dim);color:var(--green);}
.mc-btn.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red);}
.mc-btn.disabled{pointer-events:none;opacity:.5;}

.q-feedback{margin-top:10px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;display:none;}
.q-feedback.correct{display:block;background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.q-feedback.wrong{display:block;background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.3);}

.completed-q{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--green-dim);border:1px solid rgba(34,197,94,.2);border-radius:8px;font-size:13px;color:var(--green);font-weight:500;}

/* MODEL ANSWER */
.model-answer{background:var(--green-dim);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:20px;margin-top:12px;}
.model-title{font-size:13px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.model-text{font-size:14px;line-height:2;color:var(--text);}

/* SCORE BAR */
.score-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.score-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);}
.score-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.next-btn{font-family:'Outfit',system-ui,sans-serif;font-size:14px;font-weight:600;padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;}
.next-btn:hover{opacity:.9;}
.menu-btn{font-family:'Outfit',system-ui,sans-serif;font-size:13px;font-weight:500;padding:8px 16px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;}
.menu-btn:hover{border-color:var(--accent);}

/* SUMMARY STATS TABLE */
.stats-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:13px;margin:12px 0;}
.stats-table td,.stats-table th{padding:6px 10px;border:1px solid var(--border);text-align:center;}
.stats-table th{background:var(--surface-alt);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;color:var(--muted);}

/* FINAL SCREEN */
.final-screen{display:none;max-width:500px;margin:60px auto;padding:0 24px;text-align:center;}
.final-screen h2{font-size:28px;font-weight:700;margin-bottom:8px;}
.final-screen .final-score{font-family:'JetBrains Mono',monospace;font-size:48px;font-weight:700;color:var(--accent);margin:20px 0;}
.final-screen .final-label{font-size:14px;color:var(--muted);margin-bottom:6px;}
.final-screen .final-best{font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--green);margin-bottom:24px;}
.final-screen .final-breakdown{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:24px;}
.final-screen .final-breakdown .fb-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(42,46,58,.5);font-size:14px;}
.final-screen .final-breakdown .fb-row:last-child{border-bottom:none;}
.final-screen .final-breakdown .fb-score{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent);}
.final-btns{display:flex;gap:12px;justify-content:center;}

@media(max-width:768px){
  .game-layout{grid-template-columns:1fr;}
  .sel-grid{grid-template-columns:1fr;}
  .header{padding:14px 18px;}
  .game-container{padding:16px;}
  .q-mc{grid-template-columns:1fr;}
  .header-stats{gap:10px;}
  .stat-val{font-size:14px;}

.timer-display,.hud-timer,.timer,.time-display{display:none !important}

// Compute b and a from summary stats for L4
SCENARIOS.level4.forEach(function(s) {
  var n=s.n, Sx=s.sumX, Sy=s.sumY, Sx2=s.sumX2, Sy2=s.sumY2, Sxy=s.sumXY;
  s.equation = {
    b: (n*Sxy - Sx*Sy) / (n*Sx2 - Sx*Sx),
    a: (Sy/n) - ((n*Sxy - Sx*Sy) / (n*Sx2 - Sx*Sx)) * (Sx/n)
  };
});

// ===== SEEDED RANDOM =====
function seededRandom(seed) {
  return function() {
    seed = (seed * 16807 + 0) % 2147483647;
    return (seed - 1) / 2147483646;
  };
}

function generatePoints(scenario) {
  var rng = seededRandom(scenario.seed);
  var points = [];
  var xStep = (scenario.xRange[1] - scenario.xRange[0]) / scenario.n;
  for (var i = 0; i < scenario.n; i++) {
    var x = scenario.xRange[0] + xStep * i + rng() * xStep * 0.8;
    var yIdeal = scenario.equation.a + scenario.equation.b * x;
    var scatter = (1 - Math.abs(scenario.r)) * (scenario.yRange[1] - scenario.yRange[0]) * 0.15;
    var y = yIdeal + (rng() - 0.5) * 2 * scatter;
    points.push({ x: x, y: Math.max(scenario.yRange[0], Math.min(scenario.yRange[1], y)) });
  }
  return points;
}

// ===== HELPERS =====
function kx(latex) { return katex.renderToString(latex, {throwOnError:false, displayMode:false}); }
function kxBlock(latex) { return katex.renderToString(latex, {throwOnError:false, displayMode:true}); }
function round2(v) { return Math.round(v * 100) / 100; }
function round1(v) { return Math.round(v * 10) / 10; }
function absB(s) { return Math.abs(s.equation.b); }
function corrDir(r) { return r > 0 ? 'positive' : 'negative'; }
function corrStrength(r) {
  var a = Math.abs(r);
  if (a >= 0.90) return 'very strong';
  if (a >= 0.70) return 'strong';
  if (a >= 0.40) return 'moderate';
  return 'weak';
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ===== DRAW SCATTER =====
function drawScatter(sc) {
  document.getElementById('diagramTitle').textContent = sc.yLabel + ' vs ' + sc.xLabel;
  document.getElementById('diagramContext').textContent = 'n = ' + sc.n + ' data points';

  var canvas = document.getElementById('scatterCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var pad = {top:30, right:30, bottom:60, left:70};
  var plotW = W - pad.left - pad.right;
  var plotH = H - pad.top - pad.bottom;

  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#141820';
  ctx.fillRect(0, 0, W, H);

  // Grid and axes
  var xMin = sc.xRange[0], xMax = sc.xRange[1];
  var yMin = sc.yRange[0], yMax = sc.yRange[1];

  // Nice tick intervals
  function niceStep(range, maxTicks) {
    var rough = range / maxTicks;
    var mag = Math.pow(10, Math.floor(Math.log10(rough)));
    var res = rough / mag;
    if (res <= 1.5) return mag;
    if (res <= 3) return 2 * mag;
    if (res <= 7) return 5 * mag;
    return 10 * mag;
  }

  var xStep = niceStep(xMax - xMin, 8);
  var yStep = niceStep(yMax - yMin, 6);

  function mapX(v) { return pad.left + (v - xMin) / (xMax - xMin) * plotW; }
  function mapY(v) { return pad.top + plotH - (v - yMin) / (yMax - yMin) * plotH; }

  // Gridlines
  ctx.strokeStyle = '#2a2e3a';
  ctx.lineWidth = 0.5;
  ctx.font = '11px "JetBrains Mono", monospace';
  ctx.fillStyle = '#7a7f90';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  var xStart = Math.ceil(xMin / xStep) * xStep;
  for (var x = xStart; x <= xMax; x += xStep) {
    var px = mapX(x);
    ctx.beginPath(); ctx.moveTo(px, pad.top); ctx.lineTo(px, pad.top + plotH); ctx.stroke();
    var label = x % 1 === 0 ? x.toString() : x.toFixed(1);
    ctx.fillText(label, px, pad.top + plotH + 8);
  }

  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  var yStart = Math.ceil(yMin / yStep) * yStep;
  for (var y = yStart; y <= yMax; y += yStep) {
    var py = mapY(y);
    ctx.beginPath(); ctx.moveTo(pad.left, py); ctx.lineTo(pad.left + plotW, py); ctx.stroke();
    var label = y % 1 === 0 ? y.toString() : y.toFixed(1);
    ctx.fillText(label, pad.left - 8, py);
  }

  // Axes
  ctx.strokeStyle = '#7a7f90';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + plotH); ctx.lineTo(pad.left + plotW, pad.top + plotH); ctx.stroke();

  // Axis labels
  ctx.fillStyle = '#e2e4e9';
  ctx.font = '13px "Outfit", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(sc.xLabel, pad.left + plotW / 2, H - 16);

  ctx.save();
  ctx.translate(16, pad.top + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(sc.yLabel, 0, 0);
  ctx.restore();

  // Points
  var points = generatePoints(sc);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  points.forEach(function(p) {
    var px = mapX(p.x), py = mapY(p.y);
    if (px >= pad.left && px <= pad.left + plotW && py >= pad.top && py <= pad.top + plotH) {
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Regression line
  var a = sc.equation.a, b = sc.equation.b;
  var lineY0 = a + b * xMin;
  var lineY1 = a + b * xMax;
  ctx.strokeStyle = '#0ea5e9';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(mapX(xMin), mapY(lineY0));
  ctx.lineTo(mapX(xMax), mapY(lineY1));
  ctx.stroke();

  // Equation label
  ctx.fillStyle = '#0ea5e9';
  ctx.font = '12px "JetBrains Mono", monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  var eqStr = 'y = ' + round2(a) + (b >= 0 ? ' + ' : ' - ') + round2(Math.abs(b)) + 'x';
  var eqX = pad.left + 10;
  var eqY = b >= 0 ? pad.top + 20 : pad.top + plotH - 10;
  ctx.fillText(eqStr, eqX, eqY);
}

// SQ1 - Interpret gradient
function buildSQ1(sc) {
  var b = sc.equation.b;
  var dir = b > 0 ? 'increases' : 'decreases';
  var xU = sc.xLabel, yU = sc.yLabel;
  var correct = 'For every additional unit of ' + xU + ', ' + yU + ' ' + dir + ' by approximately ' + round2(absB(sc)) + '.';
  var wrongs = [
    'The ' + yU + ' starts at ' + round2(absB(sc)) + ' when ' + xU + ' is zero.',
    'For every additional unit of ' + yU + ', ' + xU + ' ' + (b > 0 ? 'decreases' : 'increases') + ' by approximately ' + round2(absB(sc)) + '.',
    'There is a ' + (Math.abs(sc.r) > 0.7 ? 'strong' : 'moderate') + ' correlation, so ' + xU + ' causes changes in ' + yU + '.'
  ];
  var options = shuffle([{text:correct,correct:true}].concat(wrongs.map(function(w){return {text:w,correct:false};})));
  return {
    type: 'mc',
    label: 'Interpret the gradient',
    question: 'The gradient of the regression line is ' + kx('b = ' + round2(b)) + '. Interpret this value in context.',
    options: options,
    hint: 'The gradient tells you the change in y for each unit increase in x. Be careful not to confuse gradient with intercept, or correlation with causation.'
  };
}

// SQ2 - Interpret intercept
function buildSQ2(sc) {
  var a = sc.equation.a;
  var xU = sc.xLabel, yU = sc.yLabel;
  var xMin = sc.xRange[0];
  var meaningful = xMin <= 0;
  var correct = 'When ' + xU + ' is zero, the predicted ' + yU + ' is ' + round2(a) + '. This ' + (meaningful ? 'may be meaningful as zero is within the range of the data.' : 'is unlikely to be meaningful as zero is outside the range of the data (extrapolation).');
  var wrongs = [
    'The intercept of ' + round2(a) + ' represents the average rate of change of ' + yU + '.',
    'When ' + yU + ' is zero, ' + xU + ' equals ' + round2(a) + '.',
    'The intercept means there is a ' + corrStrength(sc.r) + ' relationship starting at ' + round2(a) + '.'
  ];
  var options = shuffle([{text:correct,correct:true}].concat(wrongs.map(function(w){return {text:w,correct:false};})));
  return {
    type: 'mc',
    label: 'Interpret the y-intercept',
    question: 'The y-intercept of the regression line is ' + kx('a = ' + round2(a)) + '. Interpret this value in context and comment on whether it is meaningful.',
    options: options,
    hint: 'The y-intercept is the predicted value of y when x = 0. Consider whether x = 0 falls within the range of the data.'
  };
}

// SQ3 - Prediction
function buildSQ3(sc) {
  var pX = sc.predictX;
  var pY = sc.equation.a + sc.equation.b * pX;
  var tol = Math.max(0.5, 0.5 * absB(sc));
  return {
    type: 'numerical',
    label: 'Make a prediction',
    question: 'Use the regression line to estimate ' + sc.yLabel + ' when ' + sc.xLabel + ' = ' + pX + '.',
    answer: round2(pY),
    tolerance: tol,
    hint: 'Substitute x = ' + pX + ' into the equation y = ' + round2(sc.equation.a) + (sc.equation.b >= 0 ? ' + ' : ' \u2212 ') + round2(absB(sc)) + 'x.'
  };
}

// SQ4 - Reliability
function buildSQ4(sc) {
  var isExtrap = sc.sq4Type === 'extrapolation';
  var strength = corrStrength(sc.r);
  var reliableStr, correctText;

  if (isExtrap) {
    correctText = 'The prediction is unreliable because ' + sc.xLabel + ' = ' + sc.sq4X + ' lies outside the range of the data (extrapolation), so the linear trend may not continue.';
  } else {
    if (Math.abs(sc.r) >= 0.70) {
      correctText = 'The prediction is likely to be reliable because the value lies within the range of the data (interpolation) and the correlation is ' + strength + ' (r = ' + sc.r + ').';
    } else {
      correctText = 'The prediction may be unreliable despite being interpolation, because the correlation is only ' + strength + ' (r = ' + sc.r + '), meaning there is considerable scatter.';
    }
  }

  var wrongs;
  if (isExtrap) {
    wrongs = [
      'The prediction is reliable because the correlation coefficient is ' + strength + '.',
      'The prediction is reliable because we used the regression equation.',
      'The prediction is unreliable because correlation does not prove causation.'
    ];
  } else {
    wrongs = [
      'The prediction is unreliable because it is extrapolation beyond the data range.',
      'The prediction is reliable simply because we used the regression equation.',
      'The prediction is unreliable because correlation does not prove causation.'
    ];
  }

  var options = shuffle([{text:correctText,correct:true}].concat(wrongs.map(function(w){return {text:w,correct:false};})));
  return {
    type: 'mc',
    label: 'Comment on reliability',
    question: 'Comment on the reliability of predicting ' + sc.yLabel + ' when ' + sc.xLabel + ' = ' + sc.sq4X + '.',
    options: options,
    hint: 'Consider whether the x-value is inside the data range (interpolation) or outside (extrapolation), and how strong the correlation is.'
  };
}

// SQ5 - Interpret r
function buildSQ5(sc) {
  var r = sc.r;
  var strength = corrStrength(r);
  var dir = corrDir(r);
  var correct = 'There is a ' + strength + ' ' + dir + ' correlation between ' + sc.xLabel + ' and ' + sc.yLabel + '.';

  // Generate wrong options with common mistakes
  var otherStrengths = ['weak','moderate','strong','very strong'].filter(function(s){return s!==strength;});
  var wrongDir = r > 0 ? 'negative' : 'positive';
  var wrongs = [
    'There is a ' + otherStrengths[0] + ' ' + dir + ' correlation between ' + sc.xLabel + ' and ' + sc.yLabel + '.',
    'There is a ' + strength + ' ' + wrongDir + ' correlation between ' + sc.xLabel + ' and ' + sc.yLabel + '.',
    'There is a ' + otherStrengths[1] + ' ' + wrongDir + ' correlation between ' + sc.xLabel + ' and ' + sc.yLabel + '.'
  ];
  var options = shuffle([{text:correct,correct:true}].concat(wrongs.map(function(w){return {text:w,correct:false};})));
  return {
    type: 'mc',
    label: 'Describe the correlation',
    question: 'The correlation coefficient is ' + kx('r = ' + r) + '. Describe the correlation.',
    options: options,
    hint: 'Strength thresholds: 0\u20130.39 weak, 0.40\u20130.69 moderate, 0.70\u20130.89 strong, 0.90\u20131.00 very strong. The sign tells you the direction.'
  };
}

// SQ6 - Critical value test
function buildSQ6(sc) {
  var cv = sc.cv;
  var absR = Math.abs(sc.r);
  var sig = absR > cv;
  var correct, wrongs;

  if (sig) {
    correct = 'Since |r| = ' + round2(absR) + ' > ' + cv + ' (critical value), there is sufficient evidence at the 5% significance level to conclude there is correlation.';
    wrongs = [
      'Since |r| = ' + round2(absR) + ' < ' + cv + ', there is no evidence of correlation.',
      'Since r = ' + sc.r + ' > 0.5, there is always significant correlation.',
      'We cannot determine significance without knowing the p-value.'
    ];
  } else {
    correct = 'Since |r| = ' + round2(absR) + ' < ' + cv + ' (critical value), there is insufficient evidence at the 5% significance level to conclude there is correlation.';
    wrongs = [
      'Since |r| = ' + round2(absR) + ' > ' + cv + ', there is significant evidence of correlation.',
      'Since r is not zero, there must be significant correlation.',
      'The correlation is significant because the sample size is large enough.'
    ];
  }

  var options = shuffle([{text:correct,correct:true}].concat(wrongs.map(function(w){return {text:w,correct:false};})));
  return {
    type: 'mc',
    label: 'Hypothesis test',
    question: 'The critical value for n = ' + sc.n + ' at the 5% significance level (two-tailed) is ' + cv + '. Is there evidence of correlation?',
    options: options,
    hint: 'Compare |r| with the critical value. If |r| > critical value, reject H\u2080 (no correlation).'
  };
}

// SQ7 - Calculate b and a (L4 only)
function buildSQ7(sc) {
  var n=sc.n, Sx=sc.sumX, Sy=sc.sumY, Sx2=sc.sumX2, Sxy=sc.sumXY;
  var bCalc = (n*Sxy - Sx*Sy) / (n*Sx2 - Sx*Sx);
  var aCalc = Sy/n - bCalc * Sx/n;

  var statsHTML = '<table class="stats-table"><tr><th>n</th><th>&Sigma;x</th><th>&Sigma;y</th><th>&Sigma;x&sup2;</th><th>&Sigma;y&sup2;</th><th>&Sigma;xy</th></tr>';
  statsHTML += '<tr><td>' + n + '</td><td>' + Sx + '</td><td>' + Sy + '</td><td>' + Sx2 + '</td><td>' + sc.sumY2 + '</td><td>' + Sxy + '</td></tr></table>';

  var formulaB = kxBlock('b = \\frac{n\\Sigma xy - \\Sigma x \\Sigma y}{n\\Sigma x^2 - (\\Sigma x)^2}');
  var formulaA = kxBlock('a = \\bar{y} - b\\bar{x}');

  return {
    type: 'double_numerical',
    label: 'Calculate b and a',
    question: 'Using the summary statistics below, calculate the gradient ' + kx('b') + ' and intercept ' + kx('a') + ' of the regression line ' + kx('y = a + bx') + '.' + statsHTML + formulaB + formulaA,
    answer1: round2(bCalc),
    tolerance1: 0.05,
    label1: 'b =',
    answer2: round2(aCalc),
    tolerance2: 0.5,
    label2: 'a =',
    hint: 'Substitute the values carefully. b = (' + n + ' \u00d7 ' + Sxy + ' \u2212 ' + Sx + ' \u00d7 ' + Sy + ') / (' + n + ' \u00d7 ' + Sx2 + ' \u2212 ' + Sx + '\u00b2). Then a = \u0233 \u2212 b\u0078\u0304.'
  };
}

// SQ8 - Calculate r (L4 only)
function buildSQ8(sc) {
  var n=sc.n, Sx=sc.sumX, Sy=sc.sumY, Sx2=sc.sumX2, Sy2=sc.sumY2, Sxy=sc.sumXY;
  var num = n*Sxy - Sx*Sy;
  var den = Math.sqrt((n*Sx2 - Sx*Sx) * (n*Sy2 - Sy*Sy));
  var rCalc = num / den;

  var statsHTML = '<table class="stats-table"><tr><th>n</th><th>&Sigma;x</th><th>&Sigma;y</th><th>&Sigma;x&sup2;</th><th>&Sigma;y&sup2;</th><th>&Sigma;xy</th></tr>';
  statsHTML += '<tr><td>' + n + '</td><td>' + Sx + '</td><td>' + Sy + '</td><td>' + Sx2 + '</td><td>' + Sy2 + '</td><td>' + Sxy + '</td></tr></table>';

  var formula = kxBlock('r = \\frac{n\\Sigma xy - \\Sigma x \\Sigma y}{\\sqrt{\\left(n\\Sigma x^2 - (\\Sigma x)^2\\right)\\left(n\\Sigma y^2 - (\\Sigma y)^2\\right)}}');

  return {
    type: 'numerical',
    label: 'Calculate r',
    question: 'Using the summary statistics below, calculate the Pearson correlation coefficient ' + kx('r') + '.' + statsHTML + formula,
    answer: round2(rCalc),
    tolerance: 0.02,
    hint: 'Numerator = n\u03a3xy \u2212 \u03a3x\u03a3y. Denominator = \u221a[(n\u03a3x\u00b2 \u2212 (\u03a3x)\u00b2)(n\u03a3y\u00b2 \u2212 (\u03a3y)\u00b2)].'
  };
}

// ===== RENDER SUB-QUESTION =====
function renderSubQuestion() {
  var panel = document.getElementById('questionPanel');
  panel.innerHTML = '';

  // Completed sub-questions
  for (var i = 0; i < state.currentSubQ; i++) {
    var doneDiv = document.createElement('div');
    doneDiv.className = 'completed-q';
    doneDiv.innerHTML = '<span class="tick">\u2713</span> ' + state.subQuestions[i].label;
    panel.appendChild(doneDiv);
  }

  if (state.currentSubQ >= state.subQuestions.length) {
    // All sub-questions done — show model answer and next
    showModelAnswer(panel);
    return;
  }

  var sq = state.subQuestions[state.currentSubQ];
  var card = document.createElement('div');
  card.className = 'q-card';
  card.id = 'activeQ';

  var numDiv = document.createElement('div');
  numDiv.className = 'q-number';
  numDiv.textContent = 'Question ' + (state.currentSubQ + 1) + ' of ' + state.subQuestions.length;
  card.appendChild(numDiv);

  var textDiv = document.createElement('div');
  textDiv.className = 'q-text';
  textDiv.innerHTML = sq.question;
  card.appendChild(textDiv);

  if (sq.type === 'mc') {
    var mcDiv = document.createElement('div');
    mcDiv.className = 'q-mc';
    sq.options.forEach(function(opt, idx) {
      var btn = document.createElement('button');
      btn.className = 'mc-btn';
      btn.textContent = opt.text;
      btn.onclick = function() { handleMC(btn, opt, sq, mcDiv); };
      mcDiv.appendChild(btn);
    });
    card.appendChild(mcDiv);
  } else if (sq.type === 'numerical') {
    var row = document.createElement('div');
    row.className = 'q-input-row';
    var input = document.createElement('input');
    input.className = 'q-input';
    input.type = 'text';
    input.inputMode = 'decimal';
    input.placeholder = 'Enter value...';
    input.id = 'numInput';
    var submit = document.createElement('button');
    submit.className = 'q-submit';
    submit.textContent = 'Submit';
    submit.onclick = function() { handleNumerical(input, sq); };
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit.click(); });
    row.appendChild(input);
    row.appendChild(submit);
    card.appendChild(row);
  } else if (sq.type === 'double_numerical') {
    // First input (b)
    var row1 = document.createElement('div');
    row1.className = 'q-input-row';
    row1.style.marginBottom = '8px';
    var lbl1 = document.createElement('span');
    lbl1.style.fontFamily = "'JetBrains Mono',monospace";
    lbl1.style.fontSize = '14px';
    lbl1.style.color = 'var(--muted)';
    lbl1.style.minWidth = '30px';
    lbl1.textContent = sq.label1;
    var inp1 = document.createElement('input');
    inp1.className = 'q-input';
    inp1.type = 'text';
    inp1.inputMode = 'decimal';
    inp1.placeholder = 'gradient';
    inp1.id = 'numInput1';
    row1.appendChild(lbl1);
    row1.appendChild(inp1);
    card.appendChild(row1);

    // Second input (a)
    var row2 = document.createElement('div');
    row2.className = 'q-input-row';
    var lbl2 = document.createElement('span');
    lbl2.style.fontFamily = "'JetBrains Mono',monospace";
    lbl2.style.fontSize = '14px';
    lbl2.style.color = 'var(--muted)';
    lbl2.style.minWidth = '30px';
    lbl2.textContent = sq.label2;
    var inp2 = document.createElement('input');
    inp2.className = 'q-input';
    inp2.type = 'text';
    inp2.inputMode = 'decimal';
    inp2.placeholder = 'intercept';
    inp2.id = 'numInput2';
    var submit = document.createElement('button');
    submit.className = 'q-submit';
    submit.textContent = 'Submit';
    submit.onclick = function() { handleDoubleNumerical(inp1, inp2, sq); };
    inp2.addEventListener('keydown', function(e) { if (e.key === 'Enter') submit.click(); });
    row2.appendChild(lbl2);
    row2.appendChild(inp2);
    row2.appendChild(submit);
    card.appendChild(row2);
  }

  var fb = document.createElement('div');
  fb.className = 'q-feedback';
  fb.id = 'feedback';
  card.appendChild(fb);

  panel.appendChild(card);

  // Focus input if numerical
  if (sq.type === 'numerical') {
    setTimeout(function() { document.getElementById('numInput').focus(); }, 100);
  } else if (sq.type === 'double_numerical') {
    setTimeout(function() { document.getElementById('numInput1').focus(); }, 100);
  }
}

// ===== HANDLE MC =====
function handleMC(btn, opt, sq, mcDiv) {
  var fb = document.getElementById('feedback');
  var allBtns = mcDiv.querySelectorAll('.mc-btn');

  if (opt.correct) {
    btn.classList.add('correct');
    allBtns.forEach(function(b) { b.classList.add('disabled'); });
    fb.className = 'q-feedback correct';
    fb.textContent = 'Correct!';
    fb.style.display = 'block';
    state._rrQAnswered++;state._rrCorrectCount++;
    mfg('question_answered',{game_slug:'regression-rumble',level:state.level,correct:true,question_index:state._rrQAnswered});
    setTimeout(function() {
      state.currentSubQ++;
      renderSubQuestion();
    }, 1000);
  } else {
    btn.classList.add('wrong');
    btn.classList.add('disabled');
    state.wrongCount++;
    fb.className = 'q-feedback wrong';
    fb.innerHTML = sq.hint;
    fb.style.display = 'block';
  }
}

// ===== HANDLE NUMERICAL =====
function handleNumerical(input, sq) {
  var val = parseFloat(input.value);
  var fb = document.getElementById('feedback');
  if (isNaN(val)) {
    fb.className = 'q-feedback wrong';
    fb.textContent = 'Please enter a valid number.';
    fb.style.display = 'block';
    return;
  }
  if (Math.abs(val - sq.answer) <= sq.tolerance) {
    input.style.borderColor = 'var(--green)';
    input.disabled = true;
    fb.className = 'q-feedback correct';
    fb.textContent = 'Correct! The answer is ' + round2(sq.answer) + '.';
    fb.style.display = 'block';
    state._rrQAnswered++;state._rrCorrectCount++;
    mfg('question_answered',{game_slug:'regression-rumble',level:state.level,correct:true,question_index:state._rrQAnswered});
    setTimeout(function() {
      state.currentSubQ++;
      renderSubQuestion();
    }, 1000);
  } else {
    state.wrongCount++;
    fb.className = 'q-feedback wrong';
    fb.innerHTML = sq.hint;
    fb.style.display = 'block';
    input.style.borderColor = 'var(--red)';
    setTimeout(function() { input.style.borderColor = 'var(--border)'; }, 1500);
  }
}

// ===== HANDLE DOUBLE NUMERICAL =====
function handleDoubleNumerical(inp1, inp2, sq) {
  var v1 = parseFloat(inp1.value);
  var v2 = parseFloat(inp2.value);
  var fb = document.getElementById('feedback');
  if (isNaN(v1) || isNaN(v2)) {
    fb.className = 'q-feedback wrong';
    fb.textContent = 'Please enter valid numbers for both fields.';
    fb.style.display = 'block';
    return;
  }
  var b1ok = Math.abs(v1 - sq.answer1) <= sq.tolerance1;
  var b2ok = Math.abs(v2 - sq.answer2) <= sq.tolerance2;

  if (b1ok && b2ok) {
    inp1.style.borderColor = 'var(--green)';
    inp2.style.borderColor = 'var(--green)';
    inp1.disabled = true;
    inp2.disabled = true;
    fb.className = 'q-feedback correct';
    fb.textContent = 'Correct! b = ' + round2(sq.answer1) + ', a = ' + round2(sq.answer2) + '.';
    fb.style.display = 'block';
    state._rrQAnswered++;state._rrCorrectCount++;
    mfg('question_answered',{game_slug:'regression-rumble',level:state.level,correct:true,question_index:state._rrQAnswered});
    setTimeout(function() {
      state.currentSubQ++;
      renderSubQuestion();
    }, 1000);
  } else {
    state.wrongCount++;
    var msg = '';
    if (!b1ok && !b2ok) msg = 'Both values are incorrect. ';
    else if (!b1ok) msg = 'The gradient b is incorrect. ';
    else msg = 'The intercept a is incorrect. ';
    fb.className = 'q-feedback wrong';
    fb.innerHTML = msg + sq.hint;
    fb.style.display = 'block';
    if (!b1ok) { inp1.style.borderColor = 'var(--red)'; setTimeout(function(){inp1.style.borderColor='var(--border)';},1500); }
    if (!b2ok) { inp2.style.borderColor = 'var(--red)'; setTimeout(function(){inp2.style.borderColor='var(--border)';},1500); }
  }
}

// ===== MODEL ANSWER =====
function showModelAnswer(panel) {
  var sc = state.scenarios[state.currentIdx];
  var b = sc.equation.b;
  var a = sc.equation.a;
  var dir = b > 0 ? 'increases' : 'decreases';
  var strength = corrStrength(sc.r);
  var posNeg = corrDir(sc.r);
  var interpExtrap = sc.sq4Type;
  var reliable = interpExtrap === 'interpolation' && Math.abs(sc.r) >= 0.7;
  var predY = round2(a + b * sc.predictX);

  var text = 'For every additional unit of ' + sc.xLabel + ', ' + sc.yLabel + ' ' + dir + ' by approximately ' + round2(absB(sc)) + '. ';
  text += 'The prediction of ' + predY + ' for ' + sc.xLabel + ' = ' + sc.predictX + ' is likely to be ';
  text += (reliable ? 'reliable' : 'unreliable') + ' as this value ';
  text += (interpExtrap === 'interpolation' ? 'lies within' : 'lies outside') + ' the range of the data ';
  text += '(' + interpExtrap + ')';
  if (interpExtrap === 'interpolation' && Math.abs(sc.r) < 0.7) {
    text += ', though the correlation is only ' + strength;
  } else {
    text += ' and the correlation is ' + strength;
  }
  text += ' (r = ' + sc.r + '). ';
  text += 'There is a ' + strength + ' ' + posNeg + ' correlation between ' + sc.xLabel + ' and ' + sc.yLabel + '.';

  if (state.level === 'alevel' || state.level === 'level4') {
    if (sc.cv !== undefined) {
      var absR = Math.abs(sc.r);
      text += ' Comparing |r| = ' + round2(absR) + ' with the critical value ' + sc.cv + ' for n = ' + sc.n;
      text += absR > sc.cv ? ', there is significant evidence of correlation at the 5% level.' : ', there is insufficient evidence of correlation at the 5% level.';
    }
  }

  if (state.level === 'level4' && sc.sumX !== undefined) {
    text += ' The regression coefficients were calculated as b = ' + round2(sc.equation.b) + ' and a = ' + round2(sc.equation.a) + ' from the summary statistics.';
  }

  var maDiv = document.createElement('div');
  maDiv.className = 'model-answer';
  maDiv.innerHTML = '<div class="model-title">Model Answer</div><div class="model-text">' + text + '</div>';
  panel.appendChild(maDiv);

  // Scenario score
  var scenarioScore = calcScore(100, state.elapsed, state.wrongCount);
  state.score += scenarioScore;
  state.scenarioScores.push({scenario: sc, score: scenarioScore});
  document.getElementById('hScore').textContent = state.score;

  // Score bar
  var bar = document.createElement('div');
  bar.className = 'score-bar';
  var isLast = state.currentIdx >= 4;
  bar.innerHTML = '<div><div class="score-label">Scenario Score</div><div class="score-val">' + scenarioScore + '</div></div>' +
    '<div><div class="score-label">Total</div><div class="score-val">' + state.score + '</div></div>' +
    (isLast
      ? '<button class="next-btn" onclick="showFinal()">See Results</button>'
      : '<button class="next-btn" onclick="nextScenario()">Next Scenario \u2192</button>');
  panel.appendChild(bar);
}

// ===== NEXT SCENARIO =====
function nextScenario() {
  state.currentIdx++;
  state.wrongCount = 0;
  state.currentSubQ = 0;
  loadScenario();
}

// ===== FINAL SCREEN =====
function showFinal() {
  stopTimer();
  document.getElementById('gameContainer').style.display = 'none';
  var fs = document.getElementById('finalScreen');
  fs.style.display = 'block';

  window._ggAbandoned=false;
  var _rrPct=state._rrQAnswered>0?Math.round(state._rrCorrectCount/state._rrQAnswered*100):0;
  mfg('game_completed',{game_slug:'regression-rumble',level:state.level,score:state.score,questions_answered:state._rrQAnswered,accuracy:_rrPct});
  if(window.MaffsLeaderboard){MaffsLeaderboard.submitScore('regression-rumble',state.level,state.score,state._rrQAnswered).catch(function(){});if(window.MaffsScoreHistory){MaffsScoreHistory.record('regression-rumble',state.level,state.score);}}

  var _rrOldBest=getBest();
  saveBest(state.score);
  var best = getBest();
  var isNewBest = state.score >= best;
  if(state.score>_rrOldBest){mfg('personal_best_set',{game_slug:'regression-rumble',level:state.level,score:state.score,previous_best:_rrOldBest});}

  var html = '<h2>Game Complete!</h2>';
  html += '<div class="final-label">Total Score</div>';
  html += '<div class="final-score">' + state.score + '</div>';
  if (isNewBest) {
    html += '<div class="final-best" style="color:var(--green);">New Personal Best!</div>';
  } else {
    html += '<div class="final-best">Personal Best: ' + best + '</div>';
  }

  html += '<div class="final-breakdown">';
  state.scenarioScores.forEach(function(ss, i) {
    html += '<div class="fb-row"><span>Scenario ' + (i+1) + ': ' + ss.scenario.yLabel + ' vs ' + ss.scenario.xLabel + '</span><span class="fb-score">' + ss.score + '</span></div>';
  });
  html += '</div>';

  html += '<div style="text-align:center;color:#0d9488;font-size:13px;margin:12px 0"><a href="/leaderboards/" style="color:inherit;text-decoration:none">&#127942; Global leaderboard</a></div>';
  html += '<div class="final-btns">';
  html += '<button class="next-btn" onclick="restart()">Play Again</button>';
  html += '<button class="menu-btn" onclick="toMenu()">Change Level</button>';
  html += '</div>';
  html += '<a href="/" style="display:block;text-align:center;color:#7a7f90;font-size:14px;font-weight:500;text-decoration:none;margin-top:12px">\u2190 Back to Games</a>';

  fs.innerHTML = html;
}

function restart() {
  document.getElementById('finalScreen').style.display = 'none';
  beginGame();
}

function toMenu() {
  stopTimer();
  document.getElementById('finalScreen').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'none';
  document.getElementById('headerStats').style.display = 'none';
  document.getElementById('headerPill').style.display = 'none';
  document.getElementById('selector').style.display = 'block';
}
