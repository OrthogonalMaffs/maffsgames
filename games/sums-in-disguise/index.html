/* Theme: schools/assets/theme.css (canon §7.5), light row: the roster's level is Year 6 (shown as "Starter", SR-11).
   This game's own tokens. Two looks on one page (contract SUMS-IN-DISGUISE): the grown-up look by default, the kid look
   (body.look-kids) from the link fragment #kids. Every colour is a token here; the kid look only points the game's own
   tokens at its brighter set, never a base token (scripts/check-theme.py).
   Grown accent: violet-700, 7.1:1 on white. Kid accent: fuchsia-700, 6.3:1 on white and 5.9:1 on the kid look's sunny
   background, so white text on it and it on the light surfaces both clear 4.5:1. */
:root{
  --accent:#6d28d9;--accent-dim:#ede9fe;--on-accent:#ffffff;
  --d-ink:#3b2416;--d-frame:#1e293b;--d-lens:#bae6fd;--d-wig:#f59e0b;--d-wig-2:#d97706;--d-duck:#facc15;--d-beak:#f97316;
  --d-eye:#111827;--d-hat:#1f2937;--d-band:#6d28d9;--d-tag:#fef3c7;
  --kid-accent:#a21caf;--kid-accent-dim:#fae8ff;--kid-bg:#fff7d6;--kid-edge:#f0abfc;
  --kid-wig:#ec4899;--kid-wig-2:#be185d;--kid-band:#16a34a;--kid-lens:#fde68a;--kid-frame:#7e22ce;
  --pop:#be185d;--pop-edge:#ffffff;--stick:#6d28d9;--cube:#f59e0b;--kid-stick:#a21caf;--kid-cube:#0284c7;--hand-fill:#fde68a;--hand-ink:#3b2416
}
*{margin:0;padding:0;box-sizing:border-box}
body{padding-bottom:44px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.container{max-width:720px;width:100%;padding:1rem}
a.back-link{display:inline-flex;align-items:center;min-height:44px;margin:.1rem 0;color:var(--muted);text-decoration:none;font-size:.82rem}
a.back-link:hover{color:var(--text)}
.header{text-align:center;padding:.3rem 0}
.header h1{font-size:1.9rem;font-weight:700;line-height:1.15;color:var(--accent)}
.header .sub{font-size:.95rem;color:var(--muted);margin:.3rem auto .4rem;max-width:32em}
@media (max-width:420px){.header h1{font-size:1.5rem}}
.screen{display:none}.screen.active{display:block}
[hidden]{display:none!important}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin:.8rem auto;max-width:620px}
.welcome{text-align:center;font-weight:700;font-size:1.05rem;color:var(--accent);margin:.2rem 0 .5rem}
.welcome:empty{display:none}
.badges{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin:.1rem 0 .6rem}
.level-tag{display:inline-block;font-size:.78rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:var(--accent-dim);color:var(--accent)}
.menu-info{color:var(--text);font-size:.95rem;line-height:1.55}
.mode-h{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:.8rem 0 .35rem}
.btn{min-height:44px;padding:.55rem 1.1rem;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--accent-dim)}
.btn.solid{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.res-btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.lb-link{text-align:center;font-size:.88rem;margin:.6rem 0}.lb-link a{color:var(--accent)}
.stages{display:flex;flex-direction:column;gap:.5rem}
.stage-btn{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;min-height:56px;padding:.45rem .8rem;border-radius:12px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);cursor:pointer;font:inherit}
.stage-btn:hover{border-color:var(--accent)}
.stage-btn .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:700}
.stage-btn .t{font-weight:700;font-size:.95rem;line-height:1.2}
.stage-btn .d{display:block;font-weight:400;font-size:.8rem;color:var(--muted);line-height:1.3}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin-top:.7rem}

.hud{display:flex;justify-content:space-between;align-items:center;padding:.25rem .7rem;background:var(--surface);border-radius:10px;border:1px solid var(--border);margin-bottom:.35rem;gap:.3rem}
.hud-item{text-align:center;min-width:44px}
.hud-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hud-val{font-family:var(--font-num);font-size:.92rem;font-weight:700}
.qcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.55rem .7rem;display:flex;flex-direction:column;gap:.4rem}
.stage-label{font-size:.74rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}

/* The suspect: the disguise sits on the sum; when it comes off, it moves aside with the tens on its tag. */
.suspect{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:60px 0 .2rem}
/* On: centred above the sum. Off (.unmasked): moved to the box's top right, the tens on the tag beside it. The box clips,
   so nothing it does can make the page scroll sideways. */
.disguise{position:absolute;top:2px;left:50%;height:56px;transform:translateX(-50%);transform-origin:right top;transition:left .45s ease,transform .45s ease;z-index:1}
.disguise .art,.disguise svg{height:100%;width:auto;display:block}
button.disguise{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer}
button.disguise:disabled{cursor:default;opacity:1}
.suspect.unmasked .disguise{left:100%;transform:translateX(-100%) translate(-6px,2px) rotate(12deg) scale(.62)}
.tag{display:none;position:absolute;right:10px;top:42px;font-family:var(--font-num);font-weight:700;font-size:1rem;color:var(--text);background:var(--d-tag);border:2px solid var(--d-ink);border-radius:4px 10px 10px 4px;padding:0 .4rem;white-space:nowrap;z-index:2}
.suspect.unmasked .tag{display:block}
.sum{font-size:2rem;line-height:1.25;min-height:2.6rem;text-align:center;font-family:var(--font-num);font-weight:700}
.sum .katex{font-size:1em}
.clue{font-size:.92rem;color:var(--muted);text-align:center}
.clue:empty{display:none}
.say{position:relative;max-width:30em;margin:.1rem auto 0;padding:.35rem .7rem;border-radius:12px;background:var(--accent-dim);color:var(--text);font-weight:600;font-size:.95rem;line-height:1.35;text-align:center}
.say:empty{display:none}
.d-ink{fill:var(--d-ink)}
.d-frame{fill:none;stroke:var(--d-frame);stroke-width:5;stroke-linecap:round}
.d-lens{fill:var(--d-lens);stroke:var(--d-frame);stroke-width:5}
.d-wig{fill:var(--d-wig)}.d-wig-2{fill:var(--d-wig-2)}
.d-duck{fill:var(--d-duck)}.d-beak{fill:var(--d-beak)}.d-eye{fill:var(--d-eye)}
.d-wing{fill:none;stroke:var(--d-beak);stroke-width:3;stroke-linecap:round}
.d-hat{fill:var(--d-hat)}.d-band{fill:var(--d-band)}

.prompt{font-size:1.05rem;line-height:1.35;text-align:center;font-weight:600}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.speak{flex:none;width:44px;height:44px;margin-left:auto;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.speak svg{width:22px;height:22px;display:block}
.speak .s-fill{fill:currentColor}.speak .s-wave{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.opts-wrap{position:relative}
/* The pointing hand (kid look, question 1 of a run): over its target, never in the way of a tap. */
.hand{position:absolute;width:46px;height:46px;pointer-events:none;z-index:4;animation:handPulse .9s ease-in-out infinite alternate}
.hand svg{width:100%;height:100%;display:block}
.hand .h-fill{fill:var(--hand-fill);stroke:var(--hand-ink);stroke-width:2.2;stroke-linejoin:round}
@keyframes handPulse{from{transform:translate(0,0) scale(1)}to{transform:translate(-5px,-7px) scale(1.12)}}
/* Base-10 blocks (SUMS-IN-DISGUISE-ART, Amendment 3): Stages 1, 2 and 5 show the sum as ten-sticks and cubes, the tens
   taken off into the disguise, the ones added (Stage 5: the ten filled first, BRIDGE), and the tens put back. */
.blocks{display:flex;align-items:flex-end;justify-content:center;gap:.45rem;min-height:24px;margin:.2rem 0 .1rem;max-width:100%}
.blocks:empty{display:none}
.grp{display:flex;align-items:flex-end;gap:3px}
.plus{font-family:var(--font-num);font-weight:700;font-size:1.1rem;align-self:center;color:var(--muted)}
.stk{display:flex;flex-direction:column;gap:1px;padding:1px;border-radius:2px}
.stk i{display:block;width:9px;height:7px;border-radius:1px;background:var(--stick)}
.cubes{display:grid;grid-template-columns:repeat(3,10px);gap:2px;align-content:end}
.cubes i{display:block;width:10px;height:10px;border-radius:2px;background:var(--cube)}
/* Stage 5's ten outline (BRIDGE): a column of ten slots, the shape of a stick, a filled from the bottom, the rest empty.
   A real button: tapping it fills the ten. */
button.tenframe{border:2px dashed var(--accent);border-radius:8px;background:none;padding:3px;cursor:pointer;display:flex;flex-direction:column-reverse;align-items:center;gap:1px;min-width:44px;min-height:44px}
button.tenframe:disabled{cursor:default;opacity:1}
.tenframe .slot{display:block;width:10px;height:8px;border-radius:1px;border:1px dashed var(--muted);box-sizing:border-box}
.tenframe .slot.full{background:var(--cube);border:0}
.blocks-note{text-align:center;font-size:1.05rem;min-height:0}
.blocks-note:empty{display:none}
.held{display:none;position:absolute;right:8px;gap:2px;z-index:2}
.held .stk i{width:5px;height:4px}
.fly{animation:fly .55s ease-in forwards}
@keyframes fly{to{transform:translate(var(--dx,80px),var(--dy,-80px)) scale(.4);opacity:0}}
/* Parked beside the sum, and staying visible: Stages 1, 2 and 5 only (.blocky). */
.suspect.blocky.unmasked{padding-top:8px;padding-right:100px;min-height:140px}
.suspect.blocky.unmasked .disguise{top:6px;left:100%;height:40px;transform:translateX(-100%) translateX(-4px)}
.suspect.blocky.unmasked .tag{top:50px;right:8px}
.suspect.blocky.unmasked .held{display:flex;top:78px}
body.look-kids .suspect.blocky.unmasked{padding-right:110px;min-height:150px}
body.look-kids .suspect.blocky.unmasked .disguise{height:46px}
body.look-kids .suspect.blocky.unmasked .tag{top:56px}
body.look-kids .suspect.blocky.unmasked .held{top:86px}
/* The working: the sums stacked, the tens in the accent. */
.work{text-align:center;font-size:1.15rem}
.work .hl,.work .hl *{color:var(--accent);font-weight:700}
.work .row{display:block;font-family:var(--font-num)}
.prompt:empty{display:none}
.unmask-row,.peek-row{display:flex;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.3rem}
.tiles.wide{grid-template-columns:repeat(7,minmax(0,1fr))}
.tile{min-height:44px;border-radius:10px;border:2px solid var(--border);background:var(--surface-alt);color:var(--text);font-family:var(--font-num);font-size:1.1rem;font-weight:700;cursor:pointer;padding:0}
.tile:hover{border-color:var(--accent)}
.choices{display:grid;grid-template-columns:1fr;gap:.4rem}
.opt{min-height:48px;border-radius:12px;border:2px solid var(--border);background:var(--surface-alt);color:var(--text);font-family:var(--font-num);font-size:1.2rem;font-weight:700;cursor:pointer;padding:.3rem .5rem}
.opt:hover{border-color:var(--accent)}
.tile.is-right,.opt.is-right{border-color:var(--correct);color:var(--correct)}
.tile.is-wrong,.opt.is-wrong{border-color:var(--wrong);color:var(--wrong)}
.tile:disabled,.opt:disabled{cursor:default}

.fb{border-radius:12px;padding:.45rem .7rem;border:1px solid var(--border);background:var(--surface-alt);display:flex;flex-direction:column;gap:.35rem}
.fb.right{border-color:var(--correct)}
.fb.wrong{border-color:var(--wrong)}
.fb-line{font-size:.98rem;line-height:1.45;text-align:center}
.fb-next{display:flex;justify-content:center}
.feedback:empty{display:none}

/* The 67: over the play area after a big answer is marked, never before. It takes no pointer events, so it can never
   block an answer, the lock or Next; any tap anywhere closes it. */
.pop67{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.pop67 span{font-family:var(--font-num);font-weight:800;font-size:7rem;line-height:1;color:var(--pop);-webkit-text-stroke:3px var(--pop-edge);paint-order:stroke fill;animation:pop67 .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop67{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

.results{text-align:center;padding:.6rem 0}
.results h2{font-size:1.35rem;margin-bottom:.3rem}
.end-line{font-size:1rem;color:var(--text);margin:.2rem auto .4rem;max-width:30em}
.final-score{font-family:var(--font-num);font-size:2.6rem;font-weight:700;color:var(--accent);margin:.3rem 0 .1rem}
.final-of{color:var(--muted);font-size:.9rem}
.stats{color:var(--muted);line-height:1.8;font-size:.95rem;margin:.4rem 0 .7rem}
.stats b{color:var(--text)}

@media (max-width:420px){
  .container{padding:.5rem}
  .qcard{padding:.45rem .5rem;gap:.3rem}
  .sum{font-size:1.75rem}
}
@media (max-height:620px){.hud-label{display:none}.stage-label{display:none}.suspect{padding-top:50px}.disguise{height:46px}.tag{top:34px}}
@media (min-width:1024px){.container{max-width:clamp(720px,60vw,900px)}}

/* The kid look: brighter and rounder, bigger disguises; the same layout, items, marking and boards. */
body.look-kids{background:var(--kid-bg);--accent:var(--kid-accent);--accent-dim:var(--kid-accent-dim);
  --stick:var(--kid-stick);--cube:var(--kid-cube);--d-wig:var(--kid-wig);--d-wig-2:var(--kid-wig-2);--d-band:var(--kid-band);--d-lens:var(--kid-lens);--d-frame:var(--kid-frame)}
body.look-kids .panel,body.look-kids .qcard,body.look-kids .hud{border:3px solid var(--kid-edge);border-radius:22px}
body.look-kids .btn,body.look-kids .stage-btn,body.look-kids .opt,body.look-kids .tile{border-radius:999px}
body.look-kids .stage-btn{border-radius:20px}
body.look-kids .header h1{font-size:2.2rem}
body.look-kids .suspect{padding-top:82px}
body.look-kids .disguise{height:78px}
body.look-kids .tag{top:56px;font-size:1.1rem}
body.look-kids .say{border-radius:18px;font-size:1rem}
@media (max-width:420px){body.look-kids .header h1{font-size:1.7rem}}
@media (max-height:620px){body.look-kids .suspect{padding-top:62px}body.look-kids .disguise{height:58px}body.look-kids .tag{top:42px}}

body.accessible p,body.accessible .fb-line{line-height:1.7}
@media (max-width:420px){
  body.accessible .hud-label,body.accessible .stage-label{display:none}
  body.accessible .hud .stage-exit-stages,body.accessible .hud .stage-exit-home{font-size:.72rem;line-height:1.15}
}
body.accessible .katex{letter-spacing:normal;word-spacing:normal}
.a11y-toggle{background:var(--surface-alt);color:var(--text);border:1px solid var(--border);border-radius:6px;width:36px;height:36px;font-size:12px;font-weight:700;cursor:pointer}
.a11y-toggle.active,.a11y-toggle:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Jon's start-screen illustration (assets/start.webp, contract SUMS-IN-DISGUISE-ART): the card's width and corners. */
.start-art{display:block;width:100%;max-width:600px;height:auto;margin:.4rem auto .7rem;border-radius:14px}
/* Short screens (600 px tall or less): the picture capped at 120 px, cropped from the centre (Jon, 2 Nov 2026). */
@media (max-height:600px){.start-art{max-height:120px;object-fit:cover;object-position:center}}
</style>

<!-- maffs-lock-hint (canon §7.6.0): how scripts/check-answer-lock.py plays this game. 'start' opens Stage 1 and takes the moustache off, so the first screen is the little sum's tiles; 'answer' with i = 0 answers the item on screen right, and with i >= 1 answers the big sum with a decoy, so it is marked wrong and waits on Next.

  ]
}

<body>
<div class="container">
  <a href="../../" class="back-link">← Back to Games</a>
  <div id="menu" class="screen active">
    <div class="header"><h1>Sums in Disguise</h1><div class="sub" id="titleLine"></div><button class="a11y-toggle" id="a11yToggle" aria-label="Toggle dyslexia-friendly mode" title="Dyslexia-friendly mode">Aa</button></div>
    <img class="start-art" src="assets/start.webp" width="1600" height="873" alt="Five disguises hanging on coat hooks in a cloakroom: a fake moustache, round glasses, a wig, a rubber duck and a top hat, above an empty bench">
    <p class="welcome" id="welcome"></p>
    <div class="panel menu-info">
      <div class="badges"><span class="level-tag">Starter</span><span class="calc-badge" data-calc="not-allowed">Non-calculator</span></div>
      <div class="mode-h">Stages</div>
      <div class="stages" id="stageList"></div>
      <p class="note" id="menuNote"></p>
    </div>
    <div class="lb-link"><a href="/leaderboards/">Global leaderboard</a></div>
    <div class="maffs-start-note" data-maffs-start-note></div>
  </div>

  <div id="game" class="screen">
    <div class="hud">
      <div class="hud-item"><div class="hud-label">Stage</div><div class="hud-val" id="hudStage">1</div></div>
      <div class="hud-item"><div class="hud-label">Question</div><div class="hud-val" id="hudQ">1/10</div></div>
      <div class="hud-item"><div class="hud-label">Score</div><div class="hud-val" id="hudScore">0</div></div>
    </div>
    <div class="qcard" id="qcard">
      <div class="qhead"><div class="stage-label" id="stageLabel"></div><button class="speak" id="speakBtn" type="button" aria-label="Read aloud" title="Read aloud" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path class="s-fill" d="M3 9 H7 L12 4.5 V19.5 L7 15 H3 Z"/><path class="s-wave" d="M15.5 8.5 Q18 12 15.5 15.5 M18.5 6 Q22.5 12 18.5 18"/></svg></button></div>
      <div class="suspect" id="suspect">
        <button class="disguise" id="disguise" type="button" disabled><span class="art" id="disguiseArt"></span></button>
        <div class="tag" id="tag" aria-hidden="true"></div>
        <div class="sum" id="sum"></div>
        <div class="blocks" id="blocks" aria-hidden="true"></div>
        <div class="blocks-note" id="blocksNote"></div>
        <div class="held" id="held" aria-hidden="true"></div>
        <div class="clue" id="clue"></div>
        <div class="say" id="say" aria-live="polite"></div>

      box.innerHTML = '';
      box.classList.toggle('wide', S.tiles > 10);
      for (var v = 0; v <= S.tiles; v++) {
        var t = document.createElement('button');
        t.type = 'button'; t.className = 'tile'; t.dataset.val = String(v); t.textContent = String(v);
        // Each tile its own handler (check-site's option probe sees only buttons with their own; contract, from PR 811).
        t.addEventListener('click', onTile);
        box.appendChild(t);
      }
      box.hidden = false;
      MaffsLock.fresh(box);
      // On the tiles, over the 0 (never the key: the bridge is 1 to 9), so the hand never hides the answer.
      if (S.bridge && handHere()) pointAt(box, 0.04, 0);
    });
  }
  // Stage 5's step 2, as maths: "a + ? = 10" (one "=", a number on its right).
  function askBridge() {
    $('prompt').textContent = ''; delete $('prompt').dataset.line;
    $('sum').innerHTML = tex(Q.little[0] + ' + {?} = 10');
    $('sum').dataset.sum = Q.little[0] + '+?=10'; $('sum').dataset.ask = '1';
  }
  // Step 3, the ones: marked by the tile's dataset.val; no score either way. A wrong tile shows the right one. Then
  // the blocks show c counted.
  function onTile(e) {
    if (state !== 'little') return;
    if (!MaffsLock.lock($('tiles'))) return;
    var key = littleKey(Q), b = e.currentTarget, right = b.dataset.val === String(key);
    b.classList.add(right ? 'is-right' : 'is-wrong');
    var k = $('tiles').querySelector('[data-val="' + key + '"]');
    if (k) k.classList.add('is-right');
    $('tiles').dataset.picked = b.dataset.val;
    $('clue').innerHTML = tex(S.bridge ? Q.little[0] + ' + ' + key + ' = 10' : sumTex(Q.little) + ' = ' + Q.little_answer) + (right ? ' ✓' : '');
    $('clue').dataset.little = right ? 'right' : 'wrong';
    $('tiles').hidden = true;
    pointAt(null);
    if (S.bridge) {
      // Step 3 waits: the outline (now enabled) or the button fills the ten.
      state = 'fill';
      showSum(Q.little);
      $('tenFrame').disabled = false;
      showRow('fillRow', L.fill_ten, null);
      return;
    }
    var c = Q.little_answer;
    showSum(Q.little);
    if (Q.type === 'tens') drawBlocks([{ sticks: c }]); else drawBlocks([{ cubes: c }]);
    $('blocksNote').innerHTML = tex(String(c));
    showPutBack();
  }
  // Step 3 (Stage 5, BRIDGE), fill the ten: bridge cubes slide from the b group into the empty slots; the full outline, now
  // a ten, hops into the hat (tag 10t + 10, t + 1 sticks held); rest cubes stay (none when a + b = 10).
  function fillTen(now) {
    if (state !== 'fill') return;
    state = 'filling';
    showRow(null);
    pointAt(null);
    var a = Q.little[0], br = 10 - a, rest = Q.little_answer - 10, frame = $('tenFrame');
    frame.disabled = true;
    var moving = Array.prototype.slice.call($('blocks').querySelectorAll('.cubes i')).slice(0, br);
    flyThen(moving, frame, now, function () {
      // The ten is full; the rest stay beside it.
      drawBlocks([{ frame: 10 }].concat(rest ? [{ cubes: rest }] : []));
      flyThen([$('tenFrame')], $('disguise'), now, function () {
        $('tag').textContent = String(10 * tensOf(Q) + 10);
        drawHeld(tensOf(Q) + 1);
        drawBlocks(rest ? [{ cubes: rest }] : []);
        setSay(L.reveal[mode], 'reveal.' + mode);
        showPutBack();
      });
    });
  }
  function showPutBack() {
    state = 'putback';
    showRow('putRow', L.put_back, L.put_back);
  }
  // Step 5, put it back: the disguise and its sticks go back beside the cubes; the blocks show the regrouping, unlabelled.
  function putBack() {
    if (state !== 'putback') return;
    showRow(null);
    pointAt(null);
    var c = Q.little_answer, t = Q.type === 'tens' ? 0 : tensOf(Q);
    drawHeld(0);
    disguiseOn(true);
    setSay('');
    $('blocksNote').innerHTML = '';
    // The regrouping, shown by the blocks alone (NO-LABELS: no value under any group, nothing that gives the answer). A
    // group with no blocks is not drawn (ONE-EQUALS Amendment 1): a tens item has no ones, nor has a crossing item with c = 10.
    if (Q.type === 'tens') drawBlocks([{ sticks: c }]);
    else if (Q.type === 'cross') drawBlocks([{ sticks: t + 1 }].concat(c - 10 ? [{ cubes: c - 10 }] : []));
    else drawBlocks([{ sticks: t }, { cubes: c }]);
    askBig();
  }

  function askBig() {
    state = 'big';
    var opts, box = $('opts');
    if (S.flow === 'duck') {
      // The question from LINES (Amendment 1): find, with {little} as the KaTeX sum.
      $('prompt').innerHTML = L.find.split('{little}').map(esc).join(tex(sumTex(Q.little)));
      $('prompt').dataset.line = 'find';
      opts = MaffsOptions.shuffle([Q.answer_sum].concat(Q.decoys.map(function (d) { return d.sum; })));
    } else if (S.flow === 'unmask') {
      // After put-back: the plain big sum (ONE-EQUALS); the blocks under it show the regrouping.
      askSum(Q.big);
      var vals = [Q.answer];
      for (var k2 in Q.decoys) if (Object.prototype.hasOwnProperty.call(Q.decoys, k2)) vals.push(Q.decoys[k2]);
      opts = MaffsOptions.shuffle(vals);
    } else {
      askSum(Q.big);
      var vals = [Q.answer];
      for (var k in Q.decoys) if (Object.prototype.hasOwnProperty.call(Q.decoys, k)) vals.push(Q.decoys[k]);
      opts = MaffsOptions.shuffle(vals);
    }
    box.innerHTML = '';
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt';
      if (S.flow === 'duck') { b.dataset.val = o[0] + '+' + o[1]; b.innerHTML = tex(sumTex(o)); }
      else { b.dataset.val = String(o); b.textContent = String(o); }
      // Each option its own handler, where it is built (contract, from PR 811).
      b.addEventListener('click', onOption);
      box.appendChild(b);
    });
    box.hidden = false;
    MaffsLock.fresh(box);
    if (S.flow === 'wig') {
      $('peekBtn').textContent = PEEK;
      $('peekRow').hidden = false;
      MaffsLock.fresh($('peekRow'));
    }
    if (handHere() && S.flow !== 'unmask') pointAt(box);
  }

  // Stage 3: Peek lifts the wig to show the little sum, then puts it back. It costs nothing.
  function peek() {
    if (state !== 'big' || S.flow !== 'wig') return;
    peeked = true;
    disguiseOn(false);
    showSum(Q.little, true);
    setSay(L.reveal[mode], 'reveal.' + mode);
    if (peekTimer !== null) MaffsLock.cancel(peekTimer);
    peekTimer = MaffsLock.timer(unpeek, 1500);
  }
  function unpeek() {
    peekTimer = null;
    if (state !== 'big') return;
    disguiseOn(true);
    showSum(Q.big, true);
    setSay('');
  }

  // The big sum (Stage 4: the disguised sum), marked by dataset.val only.
  function onOption(e) {
    if (state !== 'big') return;
    if (!MaffsLock.lock($('opts'))) return;
    var b = e.currentTarget, val = b.dataset.val;
    var key = S.flow === 'duck' ? Q.answer_sum[0] + '+' + Q.answer_sum[1] : String(Q.answer);
    settle(val === key, val, b, key);
  }
  function decoyName(val) {
    if (S.flow === 'duck') {
      for (var i = 0; i < Q.decoys.length; i++) if (Q.decoys[i].sum[0] + '+' + Q.decoys[i].sum[1] === val) return Q.decoys[i].kind;
      return null;
    }
    for (var k in Q.decoys) if (Object.prototype.hasOwnProperty.call(Q.decoys, k) && String(Q.decoys[k]) === val) return k;
    return null;
  }
  function settle(right, val, btn, key) {
    if (peekTimer !== null) { MaffsLock.cancel(peekTimer); peekTimer = null; }
    $('peekRow').hidden = true;
    pointAt(null);
    hush();
    // The little sum is the working's first row now, so its line under the sum goes (room for Next on a phone).
    $('clue').innerHTML = '';
    // The working below repeats the regrouping the blocks showed, so the blocks go too (room for Next on a phone).
    $('blocks').innerHTML = ''; $('blocksNote').innerHTML = '';
    state = right ? 'done' : 'wrong';
    if (right) { score++; if (!peeked) unpeekedRight++; }
    $('hudScore').textContent = String(score);
    btn.classList.add(right ? 'is-right' : 'is-wrong');
    var kb = $('opts').querySelector('[data-val="' + key + '"]');
    if (kb) kb.classList.add('is-right');
    ev('question_answered', { game_slug: SLUG, level: level, mode: mode, question_index: qi, question_id: Q.id, correct: right });
    // The disguise speaks ONE line from LINES (Amendment 1), then the working, stacked, below.
    var name = right ? null : decoyName(val), sayKey, sayText;
    $('prompt').textContent = ''; delete $('prompt').dataset.line;
    if (S.flow === 'duck') {
      disguiseOn(false);
      sayKey = right ? 'duck_right' : 'duck_wrong';
      sayText = L[sayKey];
    } else {
      disguiseOn(true);
      showSum(Q.big);
      if (right) { var i = Math.floor(Math.random() * L.right.length); sayKey = 'right.' + i; sayText = L.right[i]; }
      else { sayKey = 'aha.' + ahaKey(Q, name); sayText = L.aha[ahaKey(Q, name)]; }
    }
    setSay(sayText, sayKey);
    lastLine = sayText;
    var lr = stacked(Q), last = qi >= qs.length;
    var fb = $('feedback');
    fb.innerHTML = '<div class="fb ' + (right ? 'right' : 'wrong') + '" data-why="' + (right ? 'right' : 'wrong') + '"' + (name ? ' data-pick="' + esc(name) + '"' : '') + '>' +
      '<div class="fb-line work" id="learn" data-learn="' + esc(lr[0]) + '" data-hl="' + esc(lr[1]) + '">' + lr[2] + '</div>' +
      '<div class="fb-next">' + (right ? '<button class="btn solid" id="nextBtn" type="button">' + (last ? 'See results →' : 'Next →') + '</button>' : '') + '</div></div>';
    if (right) {
      MaffsLock.fresh(fb);
      $('nextBtn').addEventListener('click', function () { if (state === 'done') advance(); });
      try { $('nextBtn').focus({ preventScroll: true }); } catch (e) {}
    } else MaffsNext.wrong({ mount: fb.querySelector('.fb-next'), onAdvance: advance });
    // The 67, after marking and never before; it changes nothing.
    if (has67(Q)) showPop();
    if (window.MaffsScroll) MaffsScroll.reveal(function () { return fb.querySelector('.fb-next .btn, .fb-next button') || fb; }, { keep: $('suspect') });
  }
  function advance() {
    if (state !== 'done' && state !== 'wrong') return;
    state = 'moving';
    hush();
    nextQuestion();
  }

  // Once per run (MaffsLock.finishOnce): game_completed and submitScore can never be sent twice.
  var finish = MaffsLock.finishOnce(function () {
    state = 'over';
    var b = board();
    ev('game_completed', { game_slug: SLUG, level: level, mode: mode, score: score, questions_answered: qs.length, questions_correct: score });
    if (window.MaffsLeaderboard) MaffsLeaderboard.submitScore(SLUG, b, score, qs.length).catch(function () {});
    if (window.MaffsScoreHistory) MaffsScoreHistory.record(SLUG, b, score);
    var pbKey = 'sid_best_' + b, prev = parseInt(lsGet(pbKey) || '0', 10) || 0, pb = score > prev;
    if (pb) { ev('personal_best_set', { game_slug: SLUG, level: level, mode: mode, score: score, previous_best: prev }); lsSet(pbKey, String(score)); }
    $('resTitle').textContent = S.name + ': done';
    $('endLine').textContent = L.end;
    $('resScore').textContent = String(score);
    $('resOf').textContent = 'out of ' + qs.length;
    $('resStats').innerHTML = (S.flow === 'wig' ? '<span id="noPeek">Done without peeking: <b>' + unpeekedRight + '</b> of <b>' + qs.length + '</b></span>' : '') +
      (pb ? (S.flow === 'wig' ? '<br>' : '') + 'New personal best' : '');
    var i = MODES.indexOf(mode);
    $('nextStageBtn').hidden = i >= MODES.length - 1;
    $('nextStageBtn').textContent = 'Next: Stage ' + (i + 2);
    show('results');
  });

  /* ---------- read aloud (Amendment 1): on-device voices only, and only when the speaker is tapped ---------- */
  // A voice whose localService is true is made on the device; a voice that is not local is never used. With no
  // speechSynthesis, or no local voice (checked again when the voices arrive), the speaker is not shown.
  // Nothing about it is sent or stored.
  var voice = null;
  var canSpeak = typeof window.speechSynthesis === 'object' && window.speechSynthesis !== null && typeof window.SpeechSynthesisUtterance === 'function';
  function pickVoice() {
    voice = null;
    try {
      var all = window.speechSynthesis.getVoices() || [], local = [];
      for (var i = 0; i < all.length; i++) if (all[i] && all[i].localService === true) local.push(all[i]);
      var pref = local.filter(function (v) { return /^en[-_]GB/i.test(v.lang || ''); })
        .concat(local.filter(function (v) { return /^en/i.test(v.lang || ''); }), local);
      voice = pref[0] || null;
    } catch (e) { voice = null; }
    $('speakBtn').hidden = !voice;
  }
  function hush() { try { if (canSpeak) window.speechSynthesis.cancel(); } catch (e) {} }
  function speak(text) {
    if (!canSpeak || !voice || voice.localService !== true || !text) return;
    hush();
    var u = new window.SpeechSynthesisUtterance(text);
    u.voice = voice;
    u.lang = voice.lang;
    window.speechSynthesis.speak(u);
  }
  // What the speaker reads now, built from the item.
  function toRead() {
    if (!Q) return '';
    var NOUN = { moustache: 'moustache', glasses: 'glasses', hat: 'hat' };
    if (state === 'mask') {
      if (Q.type === 'tens') return Q.big[0] + ' is ' + Q.little[0] + ' tens and ' + Q.big[1] + ' is ' + Q.little[1] + ' tens.';
      return Q.big[0] + ' is ' + tensOf(Q) + ' tens and ' + Q.little[0] + ' ones. The tens go in the ' + NOUN[S.disguise] + '.';
    }
    if (state === 'little') return S.bridge ? Q.little[0] + ' and how many make 10?' : words(Q.little) + ' equals what?';
    if (state === 'fill') return 'Fill the ten.';
    // Put-back speaks no value (NO-LABELS): the regrouped tens or ones would give the answer before it is chosen.
    if (state === 'putback') return 'Put it back on.';
    if (state === 'big') return S.flow === 'duck' ? L.find.split('{little}').join(words(Q.little)) : words($('sum').dataset.ask === '1' && peekTimer !== null ? Q.little : Q.big) + ' equals what?';
    if (state === 'done' || state === 'wrong') return lastLine + ' ' + spokenWorking(Q);
    return '';
  }
  if (canSpeak) {
    pickVoice();
    try { window.speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {}
  }
  window.addEventListener('pagehide', hush);

  /* ---------- the start screen ---------- */
  $('titleLine').textContent = L.title;
  $('welcome').textContent = greeting();
  $('menuNote').textContent = MENU_NOTE;
  MODES.forEach(function (m) {
    var s = STAGES[m], b = document.createElement('button');
    b.type = 'button'; b.className = 'stage-btn'; b.dataset.mode = m; b.dataset.stage = String(s.n);
    b.innerHTML = '<span class="n">' + s.n + '</span><span><span class="t"></span><span class="d"></span></span>';
    b.querySelector('.t').textContent = s.name;
    b.querySelector('.d').textContent = s.about;
    b.addEventListener('click', function () { startMode(m); });
    $('stageList').appendChild(b);
  });

  /* ---------- wiring ---------- */
  $('unmaskBtn').addEventListener('click', function () { unmask(false); });
  // The disguise is a button too: it does what the take-off button does.
  $('disguise').addEventListener('click', function () { if (state === 'mask') unmask(false); else if (state === 'putback') putBack(); });
  $('speakBtn').addEventListener('click', function () { speak(toRead()); });
  $('fillBtn').addEventListener('click', function () { fillTen(false); });
  $('putBtn').addEventListener('click', putBack);
  window.addEventListener('resize', function () { var h = $('hand'); if (!h.hidden) pointAt(document.getElementById(h.dataset.at) || $('opts')); });
  $('peekBtn').addEventListener('click', peek);
  $('nextStageBtn').addEventListener('click', function () { var i = MODES.indexOf(mode); startMode(MODES[Math.min(i + 1, MODES.length - 1)]); });
  $('againBtn').addEventListener('click', function () { startMode(mode); });
  $('menuBtn').addEventListener('click', function () { state = 'menu'; hidePop(); show('menu'); });
  // Any tap closes the 67 sooner; the tap still reaches what it was on (the pop-up takes no pointer events).
  document.addEventListener('pointerdown', function () { if (!$('pop67').hidden) hidePop(); }, true);
  (function () {
    var KEY = 'mfg_accessible', btn = $('a11yToggle');
    function apply(on) { document.body.classList.toggle('accessible', on); btn.classList.toggle('active', on); btn.setAttribute('aria-pressed', String(on)); }
    apply(lsGet(KEY) === 'true');
    btn.addEventListener('click', function () { var on = !document.body.classList.contains('accessible'); lsSet(KEY, String(on)); apply(on); });
  })();

  // Read-only views of the bank and live state, for scripts/verify-sums-in-disguise.py and the lock hint above.
  function copy(o) { return JSON.parse(JSON.stringify(o)); }
  function item(id) { for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === id) return QUESTIONS[i]; return null; }
  function click(container, sel) { MaffsLock.fresh(container, 0); var el = container.querySelector(sel); if (el) el.click(); return !!el; }
  window.SID = {
    SLUG: SLUG, MODES: MODES, LOOK: LOOK,
    bank: function () { return copy(QUESTIONS); },
    lines: function () { return copy(LINES); },
    working: function (id) { var q = item(id); return q ? stacked(q).slice(0, 2) : null; },
    ui: {
      state: function () { return state; },
      ready: function () { return state === 'mask' || state === 'little' || state === 'fill' || state === 'putback' || state === 'big'; },
      mode: function () { return mode; },
      question: function () { return Q ? copy(Q) : null; },
      score: function () { return score; },
      board: board,
      start: function (m) { startMode(m); },
      // One item on screen by itself in its stage, so a verifier can see any item.
      preview: function (id) { var q = item(id); if (q) begin('stage-' + q.stage, [q]); },
      // Taking the disguise off marks nothing, so it is called directly (a fresh window on the screen cannot swallow it).
      // via 'disguise' or 'button' taps that control instead.
      unmask: function (via) { if (via === 'disguise') { MaffsLock.fresh($('suspect'), 0); $('disguise').click(); } else if (via === 'button') { MaffsLock.fresh($('unmaskRow'), 0); $('unmaskBtn').click(); } else unmask(true); },
      // Stage 5's fill the ten: via 'outline' or 'button' taps that control; with no via, at once.
      fill: function (via) { if (via === 'outline') { MaffsLock.fresh($('suspect'), 0); var b = $('tenFrame'); if (b) b.click(); } else if (via === 'button') { MaffsLock.fresh($('fillRow'), 0); $('fillBtn').click(); } else fillTen(true); },
      // The step-2 tile key for the item on screen (the little sum's answer, or 10 - a in Stage 5).
      littleKey: function () { return Q ? littleKey(Q) : null; },
      // Put it back: via 'disguise' or 'button'; with no via, at once.
      putBack: function (via) { if (via === 'disguise') { MaffsLock.fresh($('suspect'), 0); $('disguise').click(); } else if (via === 'button') { MaffsLock.fresh($('putRow'), 0); $('putBtn').click(); } else putBack(); },
      toRead: toRead,
      tile: function (v) { return state === 'little' && click($('tiles'), '[data-val="' + v + '"]'); },
      pick: function (v) { return state === 'big' && click($('opts'), '[data-val="' + v + '"]'); },
      peek: function () { if (state === 'big') { MaffsLock.fresh($('peekRow'), 0); $('peekBtn').click(); } },
      // Answer the item on screen, from whatever step it is at: right, or the big sum with its first decoy shown.
      answer: function (right) {
        if (state === 'mask') this.unmask();
        if (state === 'little') this.tile(littleKey(Q));
        if (state === 'fill') fillTen(true);
        if (state === 'putback') putBack();
        if (state !== 'big') return;
        var key = S.flow === 'duck' ? Q.answer_sum[0] + '+' + Q.answer_sum[1] : String(Q.answer);
        if (right) { this.pick(key); return; }
        var bs = $('opts').querySelectorAll('.opt');
        for (var i = 0; i < bs.length; i++) if (bs[i].dataset.val !== key) { this.pick(bs[i].dataset.val); return; }
      },
      next: function () { var b = $('nextBtn') || document.querySelector('#feedback .maffs-next'); if (b && !b.disabled) b.click(); else if (state === 'done' || state === 'wrong') advance(); }
    }
  };
})();
</script>
